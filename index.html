    function inFrustum(position){
      const projected=worldPosition.copy(position).project(camera);
      return Math.abs(projected.x)<=1&&Math.abs(projected.y)<=1&&projected.z>=-1&&projected.z<=1;
    }
    function hitbox(index){
      return index===s.props.length?s.runnerBox:s.props[index]?.visible?pickables[index]:null;
    }
    function getAimPoint(index){
      if(index===s.props.length&&s.aimAt)return center.copy(s.aimAt).add(target.set(0,.55,0));
      return hitbox(index)?.getWorldPosition(center)??null;
    }
    function fireAt(index){
      const moving=index===s.props.length;
      const position=getAimPoint(index);
      if(!position||!inFrustum(position)||obstacleInWay(position)){clearAim();onAim(-1,true);return;}
      if(moving&&s.aimAt){
        onFire(index,{x:s.aimAt.x,z:s.aimAt.z,y:s.aimAt.y});
      }else onFire(index);
    }
    function populate(identifiers){
      for(const prop of s.props)scene.remove(prop);
      for(const item of pickables){scene.remove(item);item.geometry.dispose();item.material.dispose();}
      pickables.length=0;
      s.props=identifiers.map((id,index)=>{
        const col=index%6;
        const {x,y,z}=hideMap.slots[index];
        const prop=window.buildHideToy(T,id);
        prop.position.set(x,y+.12,z);
        prop.userData.baseY=prop.position.y;
        prop.rotation.y=(col-2.5)*.065;
        scene.add(prop);
        round(hideMap.slots[index].radius,.10,hideMap.slots[index].color,x,y+.044,z);
        const box=new T.Box3().setFromObject(prop);
        const size=box.getSize(new T.Vector3());
        const clickable=new T.Mesh(
          new T.BoxGeometry(Math.max(.78,size.x+.17),Math.max(.73,size.y+.12),Math.max(.68,size.z+.18)),
          new T.MeshBasicMaterial({visible:false})
        );
        box.getCenter(clickable.position);
        clickable.userData.slot=index;
        scene.add(clickable);
        pickables.push(clickable);
        return prop;
      });
    }
    function animateShot(index,hit){
      if(!s.props[index]||reducedMotion)return;
      if(s.pulse){s.pulse.prop.scale.setScalar(1); cancelAnimationFrame(s.raf);}
      const p=s.props[index], start=performance.now();
      s.pulse={prop:p};
      const tick=now=>{
        const progress=Math.min(1,(now-start)/480);
        const kick=Math.sin(progress*Math.PI);
        p.scale.set(1+kick*.16,1-kick*.12,1+kick*.16);
        if(hit)p.rotation.y+=.065*kick;
        draw();
        if(progress<1)s.raf=requestAnimationFrame(tick);
        else{s.pulse=null;p.scale.setScalar(1);draw();}
      };
      s.raf=requestAnimationFrame(tick);
    }
    function selectAt(clientX,clientY){
      const b=canvas.getBoundingClientRect();
      const x=(clientX-b.left)/b.width*2-1,y=1-(clientY-b.top)/b.height*2;
      return pick(cast(x,y));
    }
    function drag(dx,dy){
      s.selected=-1;s.aimAt=null;onAim(-1);
      if(canLook()){
        seeker.yaw=T.MathUtils.euclideanModulo(seeker.yaw-dx*.006+Math.PI,2*Math.PI)-Math.PI;
        seeker.pitch=T.MathUtils.clamp(seeker.pitch+dy*.005,-1.13,1.13);
      }else if(s.options?.own){
        s.yaw=T.MathUtils.clamp(s.yaw-dx*.007,-1.16,1.16);
        s.look=T.MathUtils.clamp(s.look+dy*.027,-3.2,5.2);
      }
      draw();
    }
    function walk(dx,dz){
      if(!canLook()||!Number.isFinite(dx)||!Number.isFinite(dz))return false;
      const length=Math.hypot(dx,dz);
      if(!length)return false;
      const scale=Math.min(1,1.1/length);
      const sin=Math.sin(seeker.yaw),cos=Math.cos(seeker.yaw);
      const strideX=(cos*dx+sin*dz)*scale;
      const strideZ=(sin*dx-cos*dz)*scale;
      const beforeX=seeker.x,beforeZ=seeker.z;
      const steps=Math.ceil(Math.hypot(strideX,strideZ)/.18);
      for(let i=0;i<steps;i++){
        const x=seeker.x+strideX/steps,z=seeker.z+strideZ/steps;
        if(canStep(x,seeker.z))seeker.x=x;
        if(canStep(seeker.x,z))seeker.z=z;
      }
      if(seeker.x===beforeX&&seeker.z===beforeZ)return false;
      clearAim();
      return true;
    }
    function seekerPosition(){
      return canLook()?{x:seeker.x,y:camera.position.y,z:seeker.z,yaw:seeker.yaw,pitch:seeker.pitch,fov:camera.fov}:null;
    }
    canvas.addEventListener('pointerdown',event=>{
      if(!event.isPrimary||event.button>0)return;
      s.down={id:event.pointerId,x:event.clientX,y:event.clientY,previousX:event.clientX,previousY:event.clientY};
      s.hadDrag=false;
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener('pointermove',event=>{
      if(!s.down||event.pointerId!==s.down.id)return;
      if(Math.hypot(event.clientX-s.down.x,event.clientY-s.down.y)>6)s.hadDrag=true;
      if(s.hadDrag)drag(event.clientX-s.down.previousX,event.clientY-s.down.previousY);
      s.down.previousX=event.clientX;s.down.previousY=event.clientY;
    });
    canvas.addEventListener('pointerup',event=>{
      if(!s.down||event.pointerId!==s.down.id)return;
      if(!s.hadDrag)selectAt(event.clientX,event.clientY);
      s.down=null;
    });
    canvas.addEventListener('pointercancel',()=>{s.down=null;});
    canvas.addEventListener('keydown',event=>{
      const steps={ArrowLeft:[22,0],ArrowRight:[-22,0],ArrowUp:[0,-22],ArrowDown:[0,22]};
      const walking={a:[-.62,0],d:[.62,0],w:[0,.62],s:[0,-.62]};
      if(walking[event.key.toLowerCase()]&&canLook()){event.preventDefault();walk(...walking[event.key.toLowerCase()]);}
      if(steps[event.key]){event.preventDefault();drag(...steps[event.key]);}
      if(event.key==='Enter'||event.code==='Space'){
        event.preventDefault();
        if(valid(s.selected))fireAt(s.selected);else pick(cast(0,0));
      }
    });
    function aimCenter(){
      if(valid(s.selected)){fireAt(s.selected);return;}
      if(!pick(cast(0,0),true))onAim(-1,true);
    }
    function shootSelection(index){
      const point=getAimPoint(index);
      if(!point||!inFrustum(point)||obstacleInWay(point)){clearAim();onAim(-1,true);return;}
      if(pick(index))fireAt(index);
    }
    function clearAim(){
      s.selected=-1;
      s.aimAt=null;
      onAim(-1);
      draw();
    }
    function reset(){
      s.yaw=0;s.look=0;s.zoom=1;
      seeker.yaw=0;seeker.pitch=-.05;seeker.x=0;seeker.z=spawnZ;
      clearAim();
    }
    function setZoom(delta){
      s.zoom=T.MathUtils.clamp(s.zoom+delta,.72,1.64);
      clearAim();
    }
    function attach(frame,options){
      const previous=s.options;
      s.options=options;
      if(!s.props.length)populate(options.board);
      updateRunner(options.runner);
      if(s.selected>=0&&!valid(s.selected)&&!options.pending)s.selected=-1;
      for(const [i,prop] of s.props.entries()){
        const position=options.runner;
        prop.visible=!position||hideMap.slots[i].x!==position.x||hideMap.slots[i].z!==position.z;
        prop.position.y=prop.userData.baseY-(options.guesses.includes(i)&&options.revealed!==i?.24:0);
      }
      if(s.top!==frame){
        resize.disconnect();s.top=frame;
        frame.prepend(canvas);resize.observe(frame);
      }
      frame.dataset.renderer='webgl';
      resized();
      onAim(valid(s.selected)?s.selected:-1);
      if(previous&&options.shots>previous.shots&&options.feedback){
        s.selected=-1;s.aimAt=null;onAim(-1);
        animateShot(options.feedback.index,options.feedback.found);
        draw();
      }
    }
    function destroy(){
      cancelAnimationFrame(s.raf);resize.disconnect();
      updateRunner(null);
      for(const item of pickables){item.geometry.dispose();item.material.dispose();}
      for(const item of owned)item.dispose();
      renderer.dispose();renderer.forceContextLoss();
    }
    function getTargetPosition(index){
      const model=hitbox(index);
      if(!model||!s.rendered)return null;
      model.getWorldPosition(center);
      if(!s.options.own&&(!inFrustum(center)||obstacleInWay(center)))return null;
      center.project(camera);
      const b=canvas.getBoundingClientRect();
      return {x:b.left+(center.x+1)*b.width/2,y:b.top+(1-center.y)*b.height/2};
    }
    return {attach,aimCenter,clearAim,reset,setZoom,shootSelection,destroy,getTargetPosition,walk,seekerPosition,canvas};
  }

  return {
    sync(frame,options,onAim,onFire){
      if(!frame||!options){
        if(current){current.room?.destroy();current=null;}
        return;
      }
      if(current?.key!==options.key){
        current?.room?.destroy();
        current={key:options.key,room:makeRoom(onAim,onFire)};
      }
      if(current.room){
        current.room.attach(frame,options);
        current.room.canvas.onwebglcontextlost=()=>{
          if(current?.key!==options.key||!current.room)return;
          const lost=current.room;
          current.room=null;lost.destroy();
          frame.dataset.renderer='fallback';
          const choices=frame.parentElement?.querySelector('.hide-list');
          if(choices)choices.open=true;
        };
      }else{
        frame.dataset.renderer='fallback';
        const choices=frame.parentElement?.querySelector('.hide-list');
        if(choices)choices.open=true;
      }
    },
    action(id){
      const room=current?.room;
      if(!room)return;
      if(id==='hide-fire')room.aimCenter();
      if(id==='hide-reset')room.reset();
      if(id==='hide-zoom-in')room.setZoom(.16);
      if(id==='hide-zoom-out')room.setZoom(-.16);
    },
    shootSelection(index){
      if(!current?.room)return false;
      current.room.shootSelection(index);
      return true;
    },
    walk(dx,dz){return current?.room?.walk(dx,dz)??false;},
    seekerPosition(){return current?.room?.seekerPosition()??null;},
    targetPosition(index){return current?.room?.getTargetPosition(index)??null;}
  };
})();

const hideMovement = (() => {
  const direction = {
    up: [0, -1],
    right: [1, 0],
    down: [0, 1],
    left: [-1, 0],
  };
  const keyDirection = {
    arrowup: 'up', w: 'up',
    arrowright: 'right', d: 'right',
    arrowdown: 'down', s: 'down',
    arrowleft: 'left', a: 'left',
  };
  const repeatDelay = 150;
  const editTarget = 'input, textarea, select, [contenteditable]:not([contenteditable="false"]), [role="textbox"]';
  const fingers = new Map();
  const keys = new Map();
  let root = null;
  let onStep = null;
  let timer = null;
  let installed = false;
  let attribute = 'data-hide-move';

  function available(control) {
    return Boolean(control && !control.disabled && control.getAttribute('aria-disabled') !== 'true' &&
      !control.closest('[hidden], [inert]') && control.getClientRects().length);
  }

  function controlFor(name) {
    return root?.querySelector(`[${attribute}="${name}"]`);
  }

  function clearHeld() {
    fingers.clear();
    keys.clear();
    clearInterval(timer);
    timer = null;
  }

  function stop() {
    root = null;
    onStep = null;
    clearHeld();
  }

  function announceStep() {
    if (!root?.isConnected || !onStep || document.hidden) {
      clearHeld();
      return;
    }

    if (document.activeElement?.closest?.(editTarget)) {
      keys.clear();
      release();
    }

    let dx = 0;
    let dz = 0;
    let present = false;
    const held = new Set([...fingers.values(), ...keys.values()]);
    for (const name of held) {
      const control = controlFor(name);
      if (!control) continue;
      present = true;
      if (!available(control)) continue;
      dx += direction[name][0];
      dz += direction[name][1];
    }
    if (held.size && !present) {
      clearHeld();
      return;
    }
    if (dx || dz) onStep(Math.sign(dx), Math.sign(dz));
  }

  function press() {
    if (timer === null) timer = setInterval(announceStep, repeatDelay);
    announceStep();
  }

  function release() {
    if (fingers.size || keys.size) return;
    clearInterval(timer);
    timer = null;
  }

  function pointControl(target) {
    const control = target?.closest?.(`[${attribute}]`);
    return control && root?.contains(control) && Object.hasOwn(direction, control.getAttribute(attribute)) && available(control)
      ? control
      : null;
  }

  function install() {
    if (installed) return;
    installed = true;
    document.addEventListener('pointerdown', event => {
      if (event.button !== 0) return;
      const control = pointControl(event.target);
      if (!control) return;
      event.preventDefault();
      fingers.set(event.pointerId, control.getAttribute(attribute));
      press();
    }, { passive: false });

    const releasePointer = event => {
      if (fingers.delete(event.pointerId)) release();
    };
    window.addEventListener('pointerup', releasePointer);
    window.addEventListener('pointercancel', releasePointer);
    window.addEventListener('blur', clearHeld);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) clearHeld();
    });

    document.addEventListener('keydown', event => {
      const key = event.key?.toLowerCase();
      if (!Object.hasOwn(keyDirection, key) || event.defaultPrevented || event.isComposing ||
        event.ctrlKey || event.metaKey || event.altKey || event.target?.closest?.(editTarget) ||
        document.activeElement?.closest?.(editTarget)) return;
      const name = keyDirection[key];
      if (!available(controlFor(name))) return;
      event.preventDefault();
      if (event.repeat || keys.has(key)) return;
      keys.set(key, name);
      press();
    });
    window.addEventListener('keyup', event => {
      if (keys.delete(event.key?.toLowerCase())) release();
    });

    document.addEventListener('click', event => {
      if (event.detail !== 0 || !onStep || document.hidden) return;
      const control = pointControl(event.target);
      if (!control) return;
      event.preventDefault();
      onStep(...direction[control.getAttribute(attribute)]);
    });
  }

  return {
    bind(newRoot, step, controlAttribute='data-hide-move') {
      if (!newRoot || typeof step !== 'function') {
        stop();
        return;
      }
      if(attribute!==controlAttribute)clearHeld();
      attribute=controlAttribute;
      root = newRoot;
      onStep = step;
      install();
    },
    stop,
  };
})();

const spaceWave = (() => {
  const width = 360;
  const height = 520;
  const ink = ['#79e9ed', '#fca5ce'];
  const enemyTypes = {
    scout: { hp: 2, radius: 12, color: '#ffb68d', speed: 43, interval: 2.65, spread: [0] },
    wing: { hp: 3, radius: 15, color: '#b9a0ff', speed: 35, interval: 2.35, spread: [-.17, .17] },
    tank: { hp: 6, radius: 19, color: '#ffce88', speed: 29, interval: 2.1, spread: [-.28, 0, .28] },
    boss: { hp: 62, radius: 41, color: '#ff96b7', speed: 41, interval: 1.16, spread: [-.45, -.22, 0, .22, .45] },
  };
  const formations = [
    ['scout','scout','scout','scout','scout','wing','scout','wing'],
    ['wing','scout','wing','scout','tank','wing','wing','scout','tank','wing'],
    ['wing','tank','wing','tank','wing','scout','wing','boss'],
  ];
  const lanes = [53, 114, 180, 246, 307];
  const stars = Array.from({length: 70}, (_, i) => ({
    x: (i * 149.31 + 17) % width,
    y: (i * 138.73 + 23) % height,
    large: i % 4 === 0,
    speed: (i % 5 + 1) * 8,
  }));
  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const near = (a, b, radius) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < radius ** 2;

  function random(s) {
    s.seed = (Math.imul(s.seed, 1664525) + 1013904223) >>> 0;
    return s.seed / 4294967296;
  }

  function create() {
    return {
      elapsed: 0, seed: (Date.now() + Math.floor(Math.random() * 100000)) >>> 0,
      wave: 1, phase: 'brief', pause: 1.65, spawned: 0, spawnIn: .35, cleared: 0,
      score: 0, kills: 0, revived: 0, pulse: .45, glow: 0, done: false, won: false,
      ships: [112, 248].map(x => ({x, y: 439, hp: 3, safe: 1.4, fireIn: 0, held: false, rescue: 0})),
      enemies: [], shots: [], threats: [], drops: [], sparks: [],
    };
  }

  function spark(s, point, color) {
    if (s.sparks.length < 15) s.sparks.push({x: point.x, y: point.y, color, time: .42});
  }

  function damage(s, ship, seat) {
    if (!ship.hp || ship.safe > 0) return;
    ship.hp--;
    ship.safe = 1.15;
    if (!ship.hp) ship.y = clamp(ship.y, 244, height - 42);
    spark(s, ship, ink[seat]);
  }

  function updatePilot(s, ship, seat, input, dt) {
    ship.safe = Math.max(0, ship.safe - dt);
    if (!ship.hp) {
      const partner = s.ships[1 - seat];
      ship.rescue = clamp(ship.rescue + dt * (partner.hp && near(ship, partner, 43) ? 1 : -.85), 0, 1.25);
      if (ship.rescue >= 1.25) {
        ship.hp = 1;
        ship.safe = 2.1;
        ship.rescue = 0;
        s.revived++;
        spark(s, ship, '#a9ffe6');
      }
      return;
    }

    if (input?.active && Number.isFinite(input.x) && Number.isFinite(input.y)) {
      const x = clamp(input.x * width, 17, width - 17);
      const y = clamp(input.y * height, 171, height - 23);
      const dx = x - ship.x, dy = y - ship.y;
      const distance = Math.hypot(dx, dy);
      const factor = distance > 0 ? Math.min(1, 355 * dt / distance) : 0;
      ship.x += dx * factor;
      ship.y += dy * factor;
    }
    if (s.phase === 'active') {
      ship.fireIn -= dt;
      if (ship.fireIn <= 0 && s.shots.length < 34) {
        s.shots.push({x: ship.x, y: ship.y - 14, seat});
        ship.fireIn = .19;
      }
      if (input?.fire && !ship.held && s.pulse >= 1) {
        s.pulse = 0;
        s.glow = .65;
        s.threats = [];
        for (const target of s.enemies) target.hp -= target.kind === 'boss' ? 8 : 3;
        for (const pilot of s.ships) pilot.safe = Math.max(pilot.safe, .85);
      }
    }
    ship.held = Boolean(input?.fire);
  }

  function launch(s) {
    const kind = formations[s.wave - 1][s.spawned];
    const type = enemyTypes[kind];
    const x = kind === 'boss' ? 180 : lanes[(s.spawned + 2 * s.wave + Math.floor(random(s) * 2)) % lanes.length];
    s.enemies.push({kind, x, y: -type.radius - 5, origin: x, hp: type.hp, age: 0, fireIn: .85 + random(s) * 1.3});
    s.spawned++;
    s.spawnIn = [1.05, .87, .79][s.wave - 1];
  }

  function updateEnemy(s, enemy, dt) {
    const type = enemyTypes[enemy.kind];
    const boss = enemy.kind === 'boss';
    enemy.age += dt;
    if (boss) {
      enemy.x = width * .5 + Math.sin(enemy.age * .85) * 106;
      enemy.y = Math.min(106 + Math.sin(enemy.age * 1.1) * 8, enemy.y + type.speed * dt);
    } else {
      const wing = enemy.kind === 'wing';
      enemy.x = clamp(enemy.origin + Math.sin(enemy.age * (wing ? 2.4 : 1.5) + enemy.origin) * (wing ? 35 : 20), 17, width - 17);
      enemy.y += (type.speed + (s.wave - 1) * 3) * dt;
    }
    enemy.fireIn -= dt;
    const targets = s.ships.filter(ship => ship.hp && ship.y > enemy.y + 12);
    if (enemy.fireIn > 0 || enemy.y < 27 || !targets.length) return;
    const target = targets.reduce((a, b) => Math.abs(a.x-enemy.x) < Math.abs(b.x-enemy.x) ? a : b);
    const angle = Math.atan2(target.y-enemy.y, target.x-enemy.x);
    const velocity = (boss ? 119 : 90) + s.wave * 13;
    for (const offset of type.spread) {
      if (s.threats.length >= 32) break;
      s.threats.push({x: enemy.x, y: enemy.y + type.radius * .55, vx: Math.cos(angle + offset) * velocity, vy: Math.sin(angle + offset) * velocity});
    }
    enemy.fireIn = type.interval * (.86 + random(s) * .24) - (s.wave - 1) * .10;
  }

  function checkWave(s) {
    if (s.ships.every(ship => ship.hp === 0)) {
      s.done = true;
      return;
    }
    if (s.spawned < formations[s.wave - 1].length || s.enemies.length) return;
    s.cleared = s.wave;
    if (s.wave === formations.length) {
      s.done = true;
      s.won = true;
      return;
    }
    s.wave++;
    s.phase = 'brief';
    s.pause = 1.7;
    s.spawned = 0;
    s.spawnIn = .32;
    s.shots = [];
    s.threats = [];
    for (const ship of s.ships) if (ship.hp) ship.hp = Math.min(3, ship.hp + 1);
  }

  function tick(s, inputs, dtSeconds) {
    if (s.done || !Number.isFinite(dtSeconds) || dtSeconds <= 0) return s;
    const dt = Math.min(.05, dtSeconds);
    s.elapsed += dt;
    s.pulse = clamp(s.pulse + dt * .034, 0, 1);
    s.glow = Math.max(0, s.glow - dt);
    s.sparks = s.sparks.filter(item => (item.time -= dt) > 0);
    s.ships.forEach((ship, seat) => updatePilot(s, ship, seat, inputs?.[seat], dt));
    if (s.phase === 'brief') {
      if ((s.pause -= dt) <= 0) s.phase = 'active';
      return s;
    }

    s.spawnIn -= dt;
    if (s.spawnIn <= 0 && s.spawned < formations[s.wave - 1].length) launch(s);
    for (const enemy of s.enemies) {
      if (enemy.hp > 0) updateEnemy(s, enemy, dt);
      s.ships.forEach((ship, seat) => {
        if (enemy.hp <= 0 || !ship.hp || !near(enemy, ship, enemyTypes[enemy.kind].radius + 9)) return;
        damage(s, ship, seat);
        if (enemy.kind !== 'boss') enemy.hp -= 2;
      });
    }

    s.shots = s.shots.filter(shot => {
      shot.y -= 340 * dt;
      if (shot.y < -15) return false;
      const enemy = s.enemies.find(target => target.hp > 0 && near(shot, target, enemyTypes[target.kind].radius + 4));
      if (!enemy) return true;
      enemy.hp--;
      return false;
    });
    s.threats = s.threats.filter(shot => {
      shot.x += shot.vx * dt;
      shot.y += shot.vy * dt;
      if (shot.x < -15 || shot.x > width + 15 || shot.y < -15 || shot.y > height + 15) return false;
      const seat = s.ships.findIndex(ship => ship.hp && near(ship, shot, 13));
      if (seat < 0) return true;
      damage(s, s.ships[seat], seat);
      return false;
    });
    s.enemies = s.enemies.filter(enemy => {
      if (enemy.hp > 0) return enemy.y < height + 45;
      s.kills++;
      s.score += {scout: 80, wing: 115, tank: 175, boss: 900}[enemy.kind];
      s.pulse = Math.min(1, s.pulse + .12);
      spark(s, enemy, enemyTypes[enemy.kind].color);
      if (s.kills % 5 === 0 && s.drops.length < 4) s.drops.push({x: enemy.x, y: enemy.y});
      return false;
    });
    s.drops = s.drops.filter(drop => {
      drop.y += 63 * dt;
      if (s.ships.some(ship => ship.hp && near(ship, drop, 22))) {
        for (const ship of s.ships) if (ship.hp) ship.hp = Math.min(3, ship.hp + 1);
        s.pulse = Math.min(1, s.pulse + .28);
        spark(s, drop, '#9af5c2');
        return false;
      }
      return drop.y < height + 15;
    });
    checkWave(s);
    return s;
  }

  function polygon(ctx, points, color) {
    ctx.beginPath();
    ctx.moveTo(...points[0]);
    for (const point of points.slice(1)) ctx.lineTo(...point);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  function disk(ctx, x, y, radius, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
  }

  function ring(ctx, x, y, radius, color, weight = 1.5) {
    ctx.lineWidth = weight;
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.stroke();
  }

  function backdrop(ctx, s) {
    const gradient = ctx.createLinearGradient(0, 0, width, height);
    gradient.addColorStop(0, '#0f1939');
    gradient.addColorStop(.56, '#202044');
    gradient.addColorStop(1, '#291944');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);
    const haze = ctx.createRadialGradient(239, 134, 5, 239, 134, 205);
    haze.addColorStop(0, '#60529385');
    haze.addColorStop(.60, '#462c6736');
    haze.addColorStop(1, '#15183700');
    ctx.fillStyle = haze;
    ctx.fillRect(0, 0, width, height);
    for (const star of stars) {
      ctx.fillStyle = star.large ? '#d8d4fdb9' : '#9dabd16a';
      ctx.fillRect(star.x, (star.y + s.elapsed * star.speed) % height, star.large ? 1.7 : 1, star.large ? 4.7 : 1.6);
    }
    ctx.strokeStyle = '#ada0e31e';
    for (const x of [26,75,116,244,285,334]) {
      ctx.beginPath();
      ctx.moveTo((x - width / 2) * .53 + width / 2, 59);
      ctx.lineTo(x, height);
      ctx.stroke();
    }
  }

  function drawEnemy(ctx, enemy) {
    const type = enemyTypes[enemy.kind];
    ctx.save();
    ctx.translate(enemy.x, enemy.y);
    if (enemy.kind === 'boss') {
      polygon(ctx, [[-53,-7],[-43,-23],[-19,-17],[0,-31],[19,-17],[43,-23],[53,-7],[45,13],[20,18],[0,31],[-20,18],[-45,13]], '#c27ec8');
      polygon(ctx, [[-48,-5],[-28,-10],[-20,9],[-5,14],[0,26],[5,14],[20,9],[28,-10],[48,-5],[39,9],[24,15],[0,27],[-24,15],[-39,9]], '#f795bc');
      polygon(ctx, [[-14,-16],[0,-25],[14,-16],[20,4],[0,23],[-20,4]], '#5b497e');
      disk(ctx, 0, -1, 7.5, '#ffe2c5');
      disk(ctx, 0, -1, 4, '#fa85bc');
    } else if (enemy.kind === 'wing') {
      polygon(ctx, [[-19,-7],[-6,-5],[0,-14],[6,-5],[19,-7],[16,7],[0,13],[-16,7]], type.color);
      polygon(ctx, [[0,-6],[6,3],[0,9],[-6,3]], '#534270');
    } else if (enemy.kind === 'tank') {
      polygon(ctx, [[-20,-10],[-10,-16],[10,-16],[20,-10],[20,8],[9,14],[-9,14],[-20,8]], '#9c647f');
      polygon(ctx, [[-15,-9],[-8,-13],[8,-13],[15,-9],[12,9],[0,14],[-12,9]], type.color);
      ctx.fillStyle = '#794572';
      ctx.fillRect(-6,-3,12,6);
    } else {
      polygon(ctx, [[0,-11],[13,-6],[10,3],[0,12],[-10,3],[-13,-6]], type.color);
      polygon(ctx, [[0,-5],[5,0],[0,5],[-5,0]], '#9a5a79');
    }
    if (enemy.kind === 'boss' || enemy.hp < type.hp) {
      const wide = enemy.kind === 'boss' ? 100 : 27;
      const y = -type.radius - 8;
      ctx.fillStyle = '#3d2d57';
      ctx.fillRect(-wide / 2,y,wide,4);
      ctx.fillStyle = type.color;
      ctx.fillRect(-wide / 2,y,wide * enemy.hp / type.hp,4);
    }
    ctx.restore();
  }

  function drawShip(ctx, s, ship, seat, mySeat) {
    ctx.save();
    ctx.translate(ship.x, ship.y);
    const color = ink[seat];
    if (!ship.hp) {
      ring(ctx, 0, 0, 21, color + '88', 1.4);
      ctx.strokeStyle = '#b0fae0';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 24, -Math.PI / 2, (ship.rescue / 1.25 * 2 - .5) * Math.PI);
      ctx.stroke();
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.font = '700 11px system-ui, sans-serif';
      ctx.fillText('SOS', 0, 4);
      ctx.restore();
      return;
    }
    const flame = 10 + Math.sin(s.elapsed * 44 + seat) * 4;
    polygon(ctx, [[-6,10],[6,10],[0,14+flame]], color + '8f');
    polygon(ctx, [[-3,11],[3,11],[0,15+flame*.46]], '#fff8d9');
    if (ship.safe > 0) ring(ctx, 0, 0, 21, color + '82');
    polygon(ctx, [[0,-19],[6,-8],[15,2],[16,12],[6,8],[0,12],[-6,8],[-16,12],[-15,2],[-6,-8]], color);
    polygon(ctx, [[0,-11],[6,2],[0,8],[-6,2]], '#414675');
    polygon(ctx, [[0,-9],[2,-2],[0,2],[-2,-2]], '#eaffff');
    if (seat === mySeat) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.strokeRect(-11, 24, 22, 3);
      ctx.fillStyle = color;
      ctx.fillRect(-11, 24, 22 * ship.hp / 3, 3);
    }
    ctx.restore();
  }

  function draw(ctx, s, seat) {
    ctx.save();
    backdrop(ctx, s);
    for (const shot of s.shots) {
      ctx.fillStyle = ink[shot.seat];
      ctx.fillRect(shot.x - 1.65, shot.y, 3.3, 10);
      ctx.fillStyle = '#fff7db';
      ctx.fillRect(shot.x - .6, shot.y, 1.2, 4.5);
    }
    for (const shot of s.threats) {
      disk(ctx, shot.x, shot.y, 5.5, '#e980b475');
      disk(ctx, shot.x, shot.y, 3, '#ffb2c9');
      disk(ctx, shot.x, shot.y, 1.3, '#ffe5de');
    }
    for (const enemy of s.enemies) drawEnemy(ctx, enemy);
    for (const gem of s.drops) {
      disk(ctx, gem.x, gem.y, 12, '#83f4ce49');
      polygon(ctx, [[gem.x,gem.y-8],[gem.x+6,gem.y],[gem.x,gem.y+8],[gem.x-6,gem.y]], '#b1f8d5');
    }
    for (const item of s.sparks) {
      ctx.globalAlpha = item.time / .42;
      ring(ctx, item.x, item.y, 5 + (1 - ctx.globalAlpha) * 19, item.color);
    }
    ctx.globalAlpha = 1;
    s.ships.forEach((ship, index) => drawShip(ctx, s, ship, index, seat));
    if (s.glow > 0) {
      ctx.globalAlpha = .75 * s.glow;
      ring(ctx, width / 2, 438, 12 + (1 - s.glow / .65) * 490, '#acffec', 4);
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = '#151733e0';
    ctx.fillRect(0, 0, width, 52);
    ctx.fillStyle = '#d4d7ee';
    ctx.font = '700 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('第 ' + s.wave + ' 波 · ' + s.score + ' 分', width / 2, 19);
    ctx.fillStyle = '#443859';
    ctx.fillRect(117, 30, 126, 4);
    ctx.fillStyle = s.pulse >= 1 ? '#fff1b9' : '#bca5f8';
    ctx.fillRect(117, 30, 126 * s.pulse, 4);
    ctx.font = '500 10px system-ui, sans-serif';
    ctx.fillText(s.pulse >= 1 ? '脉冲就绪' : '双人脉冲', width / 2, 46);
    for (const [index, ship] of s.ships.entries()) {
      const x = index === 0 ? 15 : width - 63;
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = ship.hp > i ? ink[index] : '#494263';
        ctx.fillRect(x + i * 15, 14, 10, 7);
      }
      ctx.fillStyle = ink[index];
      ctx.textAlign = 'left';
      ctx.fillText((index + 1) + 'P', x, 36);
    }
    if (s.phase === 'brief' || s.done) {
      ctx.fillStyle = '#251c3be8';
      ctx.fillRect(38, 188, width - 76, 89);
      ctx.strokeStyle = '#ae91c4';
      ctx.strokeRect(38.5, 188.5, width - 77, 88);
      ctx.fillStyle = '#fff1d4';
      ctx.textAlign = 'center';
      ctx.font = '700 22px system-ui, sans-serif';
      const title = s.done ? (s.won ? '星航守住了' : '双舰失去动力') : ['穿越星尘','穿过拦截线','最后防线'][s.wave - 1];
      ctx.fillText(title, width / 2, 226);
      ctx.font = '500 12px system-ui, sans-serif';
      ctx.fillStyle = '#d7c4ec';
      ctx.fillText(s.done ? s.score + ' 分 · 援救 ' + s.revived + ' 次' : '拖动战机 · 自动发射', width / 2, 253);
    }
    ctx.restore();
  }

  return {
    size: [width, height],
    control: 'drag',
    actionLabel: '脉冲',
    how: '拖动战机，自动发射。靠近失去动力的搭档可以援救，充满能量后按「脉冲」清除弹幕。',
    create,
    tick,
    draw,
    status(s) {
      if (s.done) return s.won ? '航线已守住' : '双舰失去动力';
      return '第 ' + s.wave + ' / ' + formations.length + ' 波 · ' + s.score + ' 分' +
        (s.ships.some(ship => !ship.hp) ? ' · 靠近 SOS 援救' : '');
    },
    summary(s) {
      return (s.won ? '守住航线' : '抵达第 ' + s.wave + ' 波') + ' · ' + s.score + ' 分 · 援救 ' + s.revived + ' 次';
    },
  };
})();

const toyTanks = (() => {
  const size = [720, 480];
  const [width, height] = size;
  const radius = 16;
  const colors = ['#ffadb4', '#9ae1c6'];
  const trim = ['#9f567c', '#407d7c'];
  const positions = [[67,240],[653,240]];
  const pickups = [[360,240],[360,63],[360,417],[196,240],[524,240]];
  const walls = [
    [128,82,100,22], [492,376,100,22], [128,376,100,22], [492,82,100,22],
    [148,150,23,76], [549,254,23,76], [148,254,23,76], [549,150,23,76],
    [298,133,124,22], [298,325,124,22], [252,205,23,70], [445,205,23,70],
  ];
  const foam = [
    [241,100,29,29], [450,351,29,29], [241,351,29,29], [450,100,29,29],
    [297,49,30,30], [393,401,30,30], [393,49,30,30], [297,401,30,30],
    [314,190,30,30], [376,260,30,30], [376,190,30,30], [314,260,30,30],
  ];
  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

  function newPlayers() {
    return positions.map(([x,y], seat) => ({ x,y,angle:seat ? Math.PI : 0,cool:0,boost:0 }));
  }

  function newBlocks() {
    const toBlock = (coords, soft) => coords.map(([x,y,w,h])=>({ x,y,w,h,soft }));
    return [...toBlock(walls,false),...toBlock(foam,true)];
  }

  function create() {
    return { players:newPlayers(), blocks:newBlocks(), bubbles:[], scores:[0,0], round:0, phase:'play', resetIn:0,
      pickup:{x:360,y:240,cooldown:0,index:0}, spark:null, clock:0, done:false, winner:null };
  }

  function meets(block, x, y, padding) {
    const nearestX = clamp(x,block.x,block.x+block.w);
    const nearestY = clamp(y,block.y,block.y+block.h);
    return (x-nearestX)**2+(y-nearestY)**2 < padding**2;
  }

  function moveTank(state, seat, input, dt) {
    const player = state.players[seat];
    const other = state.players[1-seat];
    const rawX = Number.isFinite(input?.x) ? clamp(input.x,-1,1) : 0;
    const rawY = Number.isFinite(input?.y) ? clamp(input.y,-1,1) : 0;
    const x = input?.active === false ? 0 : rawX;
    const y = input?.active === false ? 0 : rawY;
    const distance = Math.hypot(x,y);
    player.cool = Math.max(0,player.cool-dt);
    player.boost = Math.max(0,player.boost-dt);
    if (distance > .12) {
      player.angle = Math.atan2(y,x);
      const stride = (player.boost ? 226 : 174) * dt / Math.max(1,distance);
      const isOpen = (nextX,nextY) => Math.hypot(nextX-other.x,nextY-other.y) >= radius*1.85 &&
        !state.blocks.some(block=>meets(block,nextX,nextY,radius));
      const nextX = clamp(player.x+x*stride,radius+4,width-radius-4);
      const nextY = clamp(player.y+y*stride,radius+4,height-radius-4);
      if (isOpen(nextX,player.y)) player.x = nextX;
      if (isOpen(player.x,nextY)) player.y = nextY;
    }
    if (!input?.fire || player.cool > 0) return;
    player.cool = player.boost ? .25 : .46;
    const dx = Math.cos(player.angle), dy = Math.sin(player.angle);
    state.bubbles.push({ x:player.x+dx*13,y:player.y+dy*13,dx,dy,seat,life:1.12 });
  }

  function tag(state, projectile) {
    const { seat } = projectile;
    state.scores[seat]++;
    state.spark = { x:projectile.x,y:projectile.y,seat,life:.52 };
    state.bubbles = [];
    if (state.scores[seat] >= 3) {
      state.done = true;
      state.winner = seat;
    } else {
      state.phase = 'reset';
      state.resetIn = .95;
    }
  }

  function moveBubbles(state, dt) {
    const surviving = [];
    for (const projectile of state.bubbles) {
      projectile.life -= dt;
      projectile.x += projectile.dx*350*dt;
      projectile.y += projectile.dy*350*dt;
      if (projectile.life <= 0 || projectile.x < 4 || projectile.x > width-4 || projectile.y < 4 || projectile.y > height-4) continue;
      const obstacle = state.blocks.findIndex(block=>meets(block,projectile.x,projectile.y,6));
      if (obstacle >= 0) {
        if (state.blocks[obstacle].soft) {
          state.blocks.splice(obstacle,1);
          state.spark = { x:projectile.x,y:projectile.y,seat:projectile.seat,life:.26 };
        }
        continue;
      }
      const other = state.players[1-projectile.seat];
      if (Math.hypot(projectile.x-other.x,projectile.y-other.y) < radius+5) {
        tag(state,projectile);
        return;
      }
      surviving.push(projectile);
    }
    state.bubbles = surviving;
  }

  function tick(state, inputs, delta) {
    if (state.done) return state;
    const dt = Number.isFinite(delta) ? clamp(delta,0,.028) : 0;
    if (!dt) return state;
    state.clock += dt;
    if (state.spark) {
      state.spark.life -= dt;
      if (state.spark.life <= 0) state.spark = null;
    }
    if (state.phase === 'reset') {
      state.resetIn -= dt;
      if (state.resetIn <= 0) {
        state.phase = 'play';
        state.round++;
        state.resetIn = 0;
        state.players = newPlayers();
        state.blocks = newBlocks();
        state.pickup = {x:360,y:240,cooldown:0,index:0};
      }
      return state;
    }
    for (let seat=0;seat<2;seat++) moveTank(state,seat,inputs?.[seat],dt);
    moveBubbles(state,dt);
    if (state.phase !== 'play' || state.done) return state;
    const prize = state.pickup;
    if (prize.cooldown > 0) {
      prize.cooldown = Math.max(0,prize.cooldown-dt);
    } else {
      const collector = state.players.find(player=>Math.hypot(player.x-prize.x,player.y-prize.y)<radius+13);
      if (collector) {
        collector.boost = 3.8;
        prize.cooldown = 6;
        prize.index = (prize.index+1)%pickups.length;
        [prize.x,prize.y] = pickups[prize.index];
      }
    }
    return state;
  }

  function panel(ctx,x,y,w,h,r,fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.roundRect(x,y,w,h,r);
    ctx.fill();
  }

  function disc(ctx,x,y,r,fill) {
    ctx.fillStyle=fill;
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
  }

  function star(ctx,x,y,r) {
    ctx.beginPath();
    for(let index=0;index<10;index++) {
      const angle=index*Math.PI/5-Math.PI/2;
      const length=index%2 ? r*.47 : r;
      const px=x+Math.cos(angle)*length, py=y+Math.sin(angle)*length;
      if(index===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();ctx.fill();
  }

  function drawTank(ctx,player,seat,mine,time) {
    ctx.save();
    ctx.translate(player.x,player.y);
    if (mine || player.boost>0) {
      ctx.strokeStyle=player.boost>0?'#ffce84':colors[seat];
      ctx.lineWidth=2;
      ctx.setLineDash(player.boost>0 ? [5,5] : []);
      ctx.lineDashOffset=-time*30;
      ctx.beginPath();
      ctx.arc(0,0,24,0,Math.PI*2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.rotate(player.angle);
    panel(ctx,-17,-16,33,34,8,'#140f227f');
    panel(ctx,-15,-15,28,9,4,trim[seat]);
    panel(ctx,-15,6,28,9,4,trim[seat]);
    for(let x=-10;x<=9;x+=6) {
      panel(ctx,x,-14,2,5,1,'#f8e8eb69');
      panel(ctx,x,8,2,5,1,'#f8e8eb69');
    }
    panel(ctx,-14,-10,28,20,7,colors[seat]);
    panel(ctx,1,-4,23,8,4,'#fff1dc');
    disc(ctx,1,0,7,trim[seat]);
    disc(ctx,0,-1,4,colors[seat]);
    disc(ctx,20,0,4,'#fff1dc');
    ctx.restore();
  }

  function draw(ctx,state,seat) {
    ctx.save();
    const floor=ctx.createLinearGradient(0,0,width,height);
    floor.addColorStop(0,'#302346');floor.addColorStop(1,'#242138');
    ctx.fillStyle=floor;ctx.fillRect(0,0,width,height);
    for(let y=20;y<height;y+=24) for(let x=20;x<width;x+=24) disc(ctx,x,y,1.15,'#a18cb82b');
    ctx.strokeStyle='#d1aec161';ctx.lineWidth=3;
    ctx.beginPath();ctx.roundRect(7,7,width-14,height-14,18);ctx.stroke();
    for(const [index,[x,y]] of positions.entries()) {
      disc(ctx,x,y,34,`${colors[index]}21`);disc(ctx,x,y,25,`${colors[index]}22`);
    }
    for(const block of state.blocks) {
      const {x,y,w,h,soft}=block;
      panel(ctx,x,y+3,w,h,5,'#130e24a3');
      panel(ctx,x,y,w,h,5,soft?'#d9968e':'#5e547f');
      panel(ctx,x+3,y+3,w-6,Math.min(5,h-6),2,soft?'#f1bcaa':'#887b9f');
      if (soft) {
        disc(ctx,x+w/2,y+h/2+3,4,'#935a78');
        disc(ctx,x+w/2-1,y+h/2+2,2,'#f4bbad');
      }
    }
    if(state.pickup.cooldown<=0) {
      const {x,y}=state.pickup;
      disc(ctx,x,y,16+Math.sin(state.clock*5)*2,'#ffce8240');
      ctx.fillStyle='#ffcf75';star(ctx,x,y,12);
    }
    for(const ball of state.bubbles) {
      disc(ctx,ball.x-ball.dx*8,ball.y-ball.dy*8,4,`${colors[ball.seat]}55`);
      disc(ctx,ball.x,ball.y,6,colors[ball.seat]);
      disc(ctx,ball.x-2,ball.y-2,2,'#fff4df');
    }
    state.players.forEach((player,index)=>drawTank(ctx,player,index,index===seat,state.clock));
    if(state.spark) {
      const flash=state.spark;
      const stretch=30-flash.life*32;
      for(let i=0;i<8;i++) {
        const angle=i*Math.PI/4;
        disc(ctx,flash.x+Math.cos(angle)*stretch,flash.y+Math.sin(angle)*stretch,2+flash.life*4,colors[flash.seat]);
      }
    }
    if(state.phase==='reset' || state.done) {
      panel(ctx,242,209,236,62,17,'#211a34e6');
      ctx.fillStyle='#fff0e3';ctx.font='700 27px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(state.done ? `玩家 ${state.winner+1} 获胜` : `${state.scores[0]}  ·  ${state.scores[1]}`,width/2,241);
    }
    ctx.restore();
  }

  return {
    size,create,tick,draw,control:'stick',actionLabel:'泡沫球',
    how:'拖动方向杆驾驶，按住泡沫球按钮出手。软积木可打散，金星会短暂加速。先拿到 3 分获胜。',
    status:state=>`${state.scores[0]} : ${state.scores[1]} · 先得 3 分`,
    summary:state=>`玩家 ${state.winner+1}以 ${state.scores[0]} : ${state.scores[1]} 赢得了玩具坦克赛。`,
  };
})();

const bubbleRivals=(()=>{
  const cols=11,rows=11,cell=38,edge=16,W=cols*cell+edge*2,H=rows*cell+edge*2;
  const colors=['#95edd1','#ff9eb4'];
  const starts=[[1,1],[9,9]];
  const around=[[1,0],[-1,0],[0,1],[0,-1]];
  const index=(x,y)=>y*cols+x;

const liveGames={flight:spaceWave,tanks:toyTanks,bubbles:bubbleRivals,hockey:airHockey};
const liveArcade=(()=>{
  const neutral=()=>({x:0,y:0,fire:false,active:false});
  const clamp=(a,min,max)=>Math.max(min,Math.min(max,a));
  let live=null;
  const inputKeys=[{left:'a',right:'d',up:'w',down:'s',fire:'f'},{left:'arrowleft',right:'arrowright',up:'arrowup',down:'arrowdown',fire:'k'}];
  function packet(input){
    return {x:clamp(Number(input?.x)||0,-1,1),y:clamp(Number(input?.y)||0,-1,1),fire:input?.fire===true,active:input?.active===true};
  }
  function output(state){
    if(!live)return;
    const show=live.root.querySelector('[data-live-status]');
    const text=live.game.status(state);
    if(show&&show.textContent!==text)show.textContent=text;
    const connection=live.root.querySelector('[data-live-connection]');
    const connected=live.connected();
    if(connection&&connection.hidden!==connected)connection.hidden=connected;
    if(connection&&!connected&&connection.textContent!=='等搭档连接')connection.textContent='等搭档连接';
  }
  function setPad(pointer,event){
    const local=live.inputs[pointer.seat];
    if(pointer.kind==='canvas'){
      const box=live.canvas.getBoundingClientRect();
      local.x=clamp((event.clientX-box.left)/box.width,0,1);
      local.y=clamp((event.clientY-box.top)/box.height,0,1);
      local.active=true;
      live.aimInitialized[pointer.seat]=true;
    }
    if(pointer.kind==='stick'){
      const box=pointer.element.getBoundingClientRect(), radius=Math.min(box.width,box.height)*.36;
      const x=(event.clientX-box.left-box.width/2)/radius,y=(event.clientY-box.top-box.height/2)/radius;
      const length=Math.max(1,Math.hypot(x,y));
      local.x=x/length;local.y=y/length;local.active=true;
      pointer.element.style.setProperty('--dx',local.x*26+'px');
      pointer.element.style.setProperty('--dy',local.y*26+'px');
    }
    if(pointer.kind==='fire'){
      local.fire=true;live.fireUntil[pointer.seat]=performance.now()+125;
    }
  }
  function pointerDown(event){
    if(!live||event.button>0)return;
    const control=event.target.closest('[data-live-control]'), onCanvas=event.target===live.canvas;
    if(!control&&(!onCanvas||live.game.control!=='drag'))return;
    const kind=control?control.dataset.liveControl:'canvas';
    let which=control?Number(control.dataset.liveSeat):live.seat;
    if(onCanvas&&live.local){
      const rect=live.canvas.getBoundingClientRect();
      which=live.game.split==='vertical'?(event.clientY-rect.top<rect.height/2?1:0):(event.clientX-rect.left<rect.width/2?0:1);
    }
    if([...live.pointers.values()].some(p=>p.kind===kind&&p.seat===which))return;
    const element=control||live.canvas, track={seat:which,kind,element};
    live.pointers.set(event.pointerId,track);
    try{element.setPointerCapture(event.pointerId);}catch{}
    event.preventDefault();setPad(track,event);
  }
  function pointerMove(event){
    const track=live?.pointers.get(event.pointerId);
    if(track)setPad(track,event);
  }
  function pointerUp(event){
    const track=live?.pointers.get(event.pointerId);
    if(!track)return;
    live.pointers.delete(event.pointerId);
    const now=live.inputs[track.seat];
    if(track.kind==='fire')now.fire=false;
    else if(track.kind==='stick'){
      now.x=0;now.y=0;now.active=false;
      track.element.style.setProperty('--dx','0px');track.element.style.setProperty('--dy','0px');
    }else now.active=false;
  }
  function clearInputs(){
    if(!live)return;
    live.pointers.clear();live.keys.clear();
    live.inputs=[neutral(),neutral()];live.fireUntil=[0,0];
    live.keyMoving=[false,false];live.aimInitialized=[false,false];
    for(const pad of live.root.querySelectorAll('[data-live-control=stick]')){
      pad.style.setProperty('--dx','0px');pad.style.setProperty('--dy','0px');
    }
  }
  function readInputs(dt,now){
    return live.inputs.map((input,i)=>{
      if(!live.local&&i!==live.seat)return live.remote;
      const keys=inputKeys[live.local?i:0], arrows=inputKeys[1];
      const down=key=>live.keys.has(keys[key])||(!live.local&&live.keys.has(arrows[key]));
      const dx=Number(down('right'))-Number(down('left')),dy=Number(down('down'))-Number(down('up'));
      if(dx||dy){
        if(live.game.control==='stick'){input.x=dx;input.y=dy;}
        else{
          if(!live.aimInitialized[i]){
            const start=live.game.split==='vertical'?[.5,i===0?.79:.21]:[i===0?.31:.69,.80];
            input.x=start[0];input.y=start[1];live.aimInitialized[i]=true;
          }
          input.x=clamp(input.x+dx*1.0*dt,0,1);input.y=clamp(input.y+dy*1.0*dt,0,1);
        }
        input.active=true;live.keyMoving[i]=true;
      }else if(live.keyMoving[i]){
        live.keyMoving[i]=false;
        if(![...live.pointers.values()].some(p=>p.seat===i&&p.kind!=='fire')){
          if(live.game.control==='stick'){input.x=0;input.y=0;}
          input.active=false;
        }
      }
      return {...input,fire:input.fire||down('fire')||(!live.local&&live.keys.has(' '))||now<live.fireUntil[i]};
    });
  }
  function frame(now){
    if(!live)return;
    const run=live;
    const dt=clamp((now-run.last)/1000,0,.065);
    run.last=now;
    const inputs=readInputs(dt,now);
    if((run.local||run.seat===0)&&!run.state.done&&run.connected()){
      if(!run.local&&now-run.remoteAt>420){run.remote=neutral();inputs[1]=run.remote;}
      run.accumulator+=dt;
      while(run.accumulator>=1/60&&!run.state.done){
        run.state=run.game.tick(run.state,inputs,1/60)||run.state;
        run.accumulator-=1/60;
      }
      if(run.state.done){run.finish(run.state);return;}
      if(!run.local&&now-run.sent>=53){
        run.sent=now;run.send({kind:'live-frame',session:run.key,frame:++run.frame,state:run.state});
      }
    }else if(!run.local&&run.seat===1&&run.connected()&&now-run.sent>=42){
      run.sent=now;run.send({kind:'live-input',session:run.key,input:inputs[1]});
    }
    run.game.draw(run.ctx,run.state,run.local?null:run.seat);
    output(run.state);
    run.raf=requestAnimationFrame(frame);
  }
  document.addEventListener('pointerdown',pointerDown,{passive:false});
  document.addEventListener('pointermove',pointerMove);
  document.addEventListener('pointerup',pointerUp);
  document.addEventListener('pointercancel',pointerUp);
  window.addEventListener('blur',clearInputs);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInputs();});
  document.addEventListener('keydown',event=>{
    if(!live||event.altKey||event.ctrlKey||event.metaKey||event.target.closest?.('input, textarea, select, dialog'))return;
    const key=event.key.toLowerCase();
    if(key===' '||inputKeys.some(input=>Object.values(input).includes(key))){event.preventDefault();live.keys.add(key);}
  });
  document.addEventListener('keyup',event=>{live?.keys.delete(event.key.toLowerCase());});
  function reset(){
    if(!live)return;
    cancelAnimationFrame(live.raf);clearInputs();live=null;
  }
  function sync(root,options){
    if(!root){reset();return;}
    if(live?.key===options.key&&live.root===root)return;
    reset();
    const canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d');
    if(!ctx)return;
    live={...options,root,canvas,ctx,last:performance.now(),accumulator:0,sent:0,remoteAt:0,remote:neutral(),frame:0,
      inputs:[neutral(),neutral()],keys:new Set(),keyMoving:[false,false],aimInitialized:[false,false],
      pointers:new Map(),fireUntil:[0,0]};
    live.raf=requestAnimationFrame(frame);
  }
  function receive(message){
    if(!live||message.session!==live.key)return;
    if(live.seat===0&&message.kind==='live-input'){live.remote=packet(message.input);live.remoteAt=performance.now();}
    if(live.seat===1&&message.kind==='live-frame'&&Number.isInteger(message.frame)&&message.frame>live.frame&&message.state&&typeof message.state==='object'){
      live.frame=message.frame;live.state=message.state;
    }
  }
  return {sync,receive,state:()=>live?.state??null};
})();

function patchScenePanel(scene,markup,selector){
  const scratch=document.createElement('div');
  scratch.innerHTML=markup;
  const next=scratch.querySelector(selector);
  const panel=scene.parentElement,nextPanel=next.parentElement;
  const available=Array.from(panel.children).filter(child=>child!==scene);
  let cursor=panel.firstElementChild;
  for(const incoming of Array.from(nextPanel.children)){
    if(incoming===next){cursor=scene.nextElementSibling;continue;}
    const prior=available.find(child=>child.tagName===incoming.tagName&&
      child.classList.item(0)===incoming.classList.item(0));
    const node=prior&&prior.outerHTML===incoming.outerHTML?prior:incoming;
    if(prior){
      available.splice(available.indexOf(prior),1);
      if(prior!==node){prior.replaceWith(node);if(prior===cursor)cursor=node;}
    }
    if(node!==cursor)panel.insertBefore(node,cursor);
    cursor=node.nextElementSibling;
  }
  for(const child of available)child.remove();
  const nextMeta=scratch.querySelector('.game-meta'),meta=app.querySelector('.game-meta');
  if(meta&&nextMeta&&meta.outerHTML!==nextMeta.outerHTML)meta.replaceWith(nextMeta);
  for(const label of ['.duel-camera-label','.duel-wall-order']){
    const existing=scene.querySelector(label),incoming=next.querySelector(label);
    if(existing&&incoming&&existing.textContent!==incoming.textContent)existing.textContent=incoming.textContent;
  }
}

function gameID(){
  return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12);
}
function reduce(current,action,actor){
  const {stage}=current;
  if(action.type==='role'&&stage==='lobby'){
    const i=action.index;
    if(!Number.isInteger(i)||!roles[i]||current.roles[1-actor]===i||current.roles[actor]===i)return current;
    const roleList=[...current.roles];roleList[actor]=i;
    return {...current,roles:roleList};
  }
  if(action.type==='hub'&&stage==='lobby'&&current.roles.every(i=>i!==null))return {...current,stage:'hub'};
  if(action.type==='lobby'&&stage==='hub')return {...current,stage:'lobby'};
  if(action.type==='map'&&stage==='game')return {...current,stage:'hub',game:null,play:null};
  if(stage==='hub'&&action.type==='walk'){
    if(!Number.isFinite(action.x)||!Number.isFinite(action.y))return current;
    const positions=[...current.positions];
    positions[actor]=[Math.max(5,Math.min(95,action.x)),Math.max(9,Math.min(88,action.y))];
    return {...current,positions};
  }
  const rematch=stage==='game'&&current.play.done&&action.type==='rematch';
  if((stage==='hub'&&action.type==='enter'&&Object.hasOwn(games,action.game)&&nearStall(current.positions[actor],action.game))||rematch){
    const id=rematch?current.game:action.game;
    if(liveGames[id]&&mode!=='solo'&&mode!=='internet')return current;
    return {...current,stage:'game',game:id,session:gameID(),play:liveGames[id]?liveGames[id].create():engines[id].init()};
  }
  if(stage==='game'&&engines[current.game]&&action.type==='game-action'&&action.input&&typeof action.input==='object'){
    const play=engines[current.game].act(current.play,action.input,actor);
    if(play!==current.play)return {...current,play};
  }
  return current;
}
let savedOk=true;
function applyState(next){
  if(!next)return;
  const previous=state;
  state=next;
  if(next.stage!=='game'||next.game!=='hide'||next.play.phase!=='guess')localHideOwner=false;
  if(next.stage==='hub'&&previous.stage==='hub')walkOrigin=previous.positions;
  if(mode==='solo'&&next.stage==='game'&&previous.stage==='game'&&previous.session===next.session){
    if(next.game==='hide'&&next.play.phase==='guess'&&previous.play.phase==='prepare')handoff=true;
    if(next.game==='hide'&&next.play.phase==='hide'&&previous.play.round!==next.play.round)handoff=true;
    if(next.game==='signal'&&next.play.turn!==previous.play.turn&&next.play.phase==='repeat')handoff=true;
  }
  if(next.stage!=='game'||next.session!==previous.session)handoff=false;
  if(next.roles[0]!==previous.roles[0]||next.roles[1]!==previous.roles[1]){
    const indexes=mode==='solo'?[0,1]:[seat];
    for(const i of indexes)archive.roles[i]=next.roles[i];
    saveLocal();
  }
  if(next.stage==='game'&&next.play.done&&!archive.records.some(r=>r.id===next.session)){
    archive.records.unshift({id:next.session,game:next.game,when:Date.now(),result:summary(next)});
    archive.records.splice(50);
    archive.wardrobe=wardrobe.earn(archive.wardrobe,next.game);
    savedOk=saveLocal();
  }
  go(next.stage);
}
const roomMessages={ROOM_NOT_FOUND:'找不到房间，请核对房间码。',ROOM_FULL:'房间已有两个人。',INVALID_TOKEN:'这个房间已结束，请重新加入。'};
async function requestRoom(path,method='GET',body,identity=room){
  const headers={};
  if(identity?.token)headers.Authorization='Bearer '+identity.token;
  if(body!==undefined)headers['Content-Type']='application/json';
  const response=await fetch('/api/rooms'+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});
  if(!(response.headers.get('content-type')||'').includes('application/json'))throw Error('无法连接房间服务，请刷新后重试。');
  const data=await response.json();
  if(!response.ok&&(response.status!==409||data.error))throw Error(roomMessages[data.error]||'房间连接失败，请再试一次。');
  return {status:response.status,data};
}
function acceptLan(data){
  const presence=Boolean(data.joined)!==joined;
  joined=Boolean(data.joined);
  if(data.version>version||data.version===version&&data.state&&view==='rooms'){
    version=data.version;applyState(data.state);
  }else if(presence)render();
}
async function pollLan(){
  if(!room||(mode!=='lan'&&mode!=='relay')||pending||polling)return;
  const here=room;
  polling=true;
  try{
    const {data}=await requestRoom('/'+here.code,'GET',undefined,here);
    if(room===here)acceptLan(data);
  }catch(e){if(room===here)notify(e.message);}
  finally{polling=false;}
}
function publishInternet(){
  let shared=state;
  if(liveGames[state.game]&&!state.play.done&&liveArcade.state())shared={...state,play:liveArcade.state()};
  if(state.game==='hide'&&state.play.hider===0&&['reveal','prepare','guess'].includes(state.play.phase)){
    const play=state.play;
    const visible=play.phase==='guess'&&play.moving;
    shared={...state,play:{...play,spot:null,decoy:null,position:visible?play.position:null,shape:visible?play.shape:null,jumpAt:visible?play.jumpAt:0,jumpUntil:visible?play.jumpUntil:0}};
  }
  if(state.game==='signal'&&state.play.phase!=='result'&&state.play.reader===0){
    shared={...state,play:{...state.play,sequence:[]}};
  }
  if(state.game==='memory'){
    const play=state.play;
    shared={...state,play:{...play,deck:play.deck.map((symbol,i)=>play.open.includes(i)||play.matched.includes(i)?symbol:null)}};
  }
  if(state.game==='duel'&&state.play.turn===1&&!state.play.done){
    const play=state.play;
    const viewParts=duelBodyParts(play).map((part,i)=>play.covers[0][i]?null:part);
    shared={...state,play:{...play,pose:null,position:null,visibleParts:viewParts}};
  }
  if(joined&&room&&!room.send({kind:'snapshot',version,state:shared}))notify('同步暂时中断。');

function peerEvent(event,connectionEpoch){
  if(epoch!==connectionEpoch||mode!=='internet')return;
  if(event.type==='connected'){
    joined=true;render();
    if(seat===0)publishInternet();
    return;
  }
  if(event.type==='disconnected'||event.type==='error'){
    if(event.type==='disconnected')joined=false;
    pending=false;render();
    notify(typeof event.message==='string'?event.message:'搭档已断开。可重新加入这个房间。');
    return;
  }
  if(event.type!=='message'||!event.message||typeof event.message!=='object')return;
  const incoming=event.message;
  if(incoming.kind==='live-input'||incoming.kind==='live-frame'){liveArcade.receive(incoming);return;}
  if(seat===0&&incoming.kind==='action'&&incoming.action&&typeof incoming.action==='object'){
    const duelInput=incoming.action.type==='game-action'&&state.game==='duel'&&incoming.session===state.session&&
      incoming.round===state.play.round&&incoming.shots===state.play.shots;
    const hideInput=incoming.action.type==='game-action'&&state.game==='hide'&&incoming.session===state.session&&
      incoming.round===state.play.round&&incoming.hidePhase===state.play.phase&&incoming.shots===state.play.shots;
    if(incoming.version===version||duelInput||hideInput){
      const next=reduce(state,incoming.action,1);
      if(next!==state){version++;applyState(next);}
    }
    publishInternet();
  }
  if(seat===1&&incoming.kind==='snapshot'&&Number.isInteger(incoming.version)&&incoming.version>=version&&incoming.state){
    pending=false;version=incoming.version;applyState(incoming.state);
  }
}
async function openRoom(create,code){
  if(roomBusy)return;

    roomDraft=code;
    if(!expectedCode(code)){roomError='请检查房间码，或请搭档重新复制邀请链接。';render();return;}
  }else roomDraft='';
  roomBusy=true;roomError='';render();
  const op=++epoch;
  mode=roomTab;
  seat=create?0:1;
  joined=false;version=0;state=fresh();pending=false;
  const preferred=archive.roles[seat];
  if(preferred!==null)state.roles[seat]=preferred;
  try{
    if(mode==='internet'){
      const conn=await (create?internetRooms.create(e=>peerEvent(e,op)):internetRooms.join(code,e=>peerEvent(e,op)));
      if(op!==epoch){conn.close();return;}
      room=conn;
      if(create)go('lobby');
      else if(view==='rooms')go('lobby');
    }else{
      const {data}=await requestRoom(create?'':'/'+code+'/join','POST',{},null);
      if(op!==epoch)return;
      room={code:data.code,token:data.token};joined=!!data.joined;version=data.version;
      if(data.state)applyState(data.state);else go('lobby');
      if(create){
        const {data:initial}=await requestRoom('/'+room.code,'PUT',{version,state});
        if(op===epoch)acceptLan(initial);
      }
      if(op===epoch)pollTimer=setInterval(pollLan,725);
    }
    if(!create&&op===epoch&&inviteCode&&location.search){
      const current=new URL(location.href);
      current.searchParams.delete('room');
      current.searchParams.delete('network');
      try{history.replaceState(null,'',current.href);}catch{}
    }
  }catch(e){if(op===epoch){roomError=e?.message||'房间连接失败。';go('rooms');}}
  finally{if(op===epoch)roomBusy=false;if(op===epoch&&view==='rooms')render();}
}
async function dispatch(action,actor=mode==='solo'?(view==='lobby'?roleCursor:view==='hub'?mapCursor:state.play?.turn??0):seat){
  if(pending)return;
  if(mode==='internet'&&seat===1){
    if(!joined){notify('搭档已断开，请重新加入。');return;}
    const move=state.game==='hide'&&action.input?.type==='move';
    pending=!move;
    if(!room.send({kind:'action',version,action,session:state.session,round:state.play?.round,shots:state.play?.shots,hidePhase:state.play?.phase})){pending=false;notify('消息发送失败，请再试一次。');}
    else{
      const sentVersion=version;
      setTimeout(()=>{
        if(mode==='internet'&&pending&&version===sentVersion){pending=false;notify('等待同步超时，可以再试一次。');}
      },3500);
    }
    return;
  }
  const next=reduce(state,action,actor);
  if(next===state)return;
  if(mode==='solo'){applyState(next);return;}
  if(mode==='internet'){
    if(!joined&&state.stage==='game'){notify('搭档已断开，请等对方重新加入。');return;}
    version++;applyState(next);publishInternet();return;
  }
  pending=true;
  const here=room;
  try{
    const {data,status}=await requestRoom('/'+here.code,'PUT',{version,state:next},here);
    if(room!==here)return;
    pending=false;acceptLan(data);
    if(status===409)notify('搭档刚刚完成了操作，请再试一次。');
  }catch(e){if(room===here){pending=false;notify(e.message);}}
}

    const text=`${mode!=='solo'&&seat!==round.hider?'搭档正在躲藏':'躲藏时间'} · ${left} 秒`;
    if(prep.textContent!==text)prep.textContent=text;
    if(!left&&!pending&&(mode==='solo'||seat===round.hider||(mode==='internet'&&seat===0))){
      dispatch({type:'game-action',input:{type:'hunt'}},round.hider);
    }
  }
  const jump=app.querySelector('#hide-jump');
  if(jump)jump.disabled=Date.now()<round.jumpUntil+240||pending;
  if(!button)return;
  const left=Math.max(0,Math.ceil((state.play.changedAt+10_000-Date.now())/1000));
  const text=left?`变身 ${left} 秒`:'随机变身';
  if(button.textContent!==text)button.textContent=text;
  button.disabled=left>0||pending;
},200);

</script>
</body>
</html>
