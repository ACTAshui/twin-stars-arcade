<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141022">
<meta name="description" content="各选一个角色，玩五款适合两个人的小游戏。">
<title>双星夜市 · 双人联机游乐园</title>
<style>
:root{color-scheme:dark;--bg:#151123;--paper:#211932;--panel:#281f3b;--line:#453553;--text:#fff7ef;--muted:#c4b5d0;--gold:#ffcd91;--rose:#fc9a9d;--violet:#c5adff;--mint:#b3dbc8;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 72% 0,#2c1e40 0,transparent 48%),var(--bg);color:var(--text);min-height:100svh}
button,input{font:inherit}
button{color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default;opacity:.5}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
button:not(:disabled):active{transform:translateY(1px)}
[hidden]{display:none!important}
.wrap{width:min(1130px,calc(100% - 64px));margin:auto}
.bar{height:83px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:0;font-weight:850;font-size:20px;line-height:1.15;letter-spacing:.08em}
.brand small{display:block;color:#c7aeba;letter-spacing:.28em;font-size:9px;margin-top:5px}
.brand-logo{display:grid;place-items:center;width:40px;height:40px;background:#f7b8a1;border-radius:13px;color:#352039;font-size:25px}
.quiet{border:1px solid var(--line);background:#211a31;border-radius:100px;padding:10px 15px;color:#ead8e7;font-size:13px;white-space:nowrap;min-height:42px}
.quiet:hover,.icon-btn:hover{background:#392c4d}
.quiet span{margin-left:4px;color:var(--gold)}
.hero{min-height:480px;position:relative;border:1px solid #504057;border-radius:28px;overflow:hidden;display:flex;align-items:center;background-color:#241932;background-image:linear-gradient(90deg,#171226 1%,#1a142bdc 30%,#1b142738 62%,#1b142710),var(--hero);background-size:cover;background-position:center 53%;animation:appear .42s ease both}
.hero-content{z-index:1;padding:56px;max-width:565px}
.kicker{display:flex;align-items:center;gap:9px;color:#f5bd9d;font-size:12px;letter-spacing:.19em;font-weight:750;margin:0 0 16px}
.kicker b{font-size:16px}
h1,h2,h3,p{margin-top:0}
.hero h1{font-size:clamp(52px,7vw,92px);font-weight:950;margin:0 0 17px;letter-spacing:-.055em;line-height:1.08;text-shadow:0 3px 24px #120d24ac}
.hero .subtitle{color:#ead7de;margin-bottom:27px;font-size:16px;line-height:1.7}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;min-height:48px;align-items:center;justify-content:center;gap:9px;padding:11px 18px;border-radius:12px;border:1px solid #554465;background:#302540;font-weight:750;font-size:14px;transition:filter .15s,background .15s,transform .15s}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.primary{background:linear-gradient(105deg,#ffc48e,#f4a0a7);color:#302035;border-color:transparent;box-shadow:0 5px 17px #ffb99426}
.btn .arrow{font-size:19px;line-height:1}
.thin{font-size:13px;min-height:43px;padding:8px 13px}
.section-head{display:flex;gap:12px;justify-content:space-between;align-items:end;margin:34px 0 14px}
.section-head h2{font-size:24px;margin:0;letter-spacing:.015em}
.section-head p{font-size:13px;color:var(--muted);margin:0}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tile{border:1px solid #463657;border-radius:17px;text-align:left;padding:15px;min-width:0;background:linear-gradient(135deg,#2d233e,#211a31);transition:border-color .18s,background .18s,transform .18s;position:relative}
.tile:hover,.tile.active{border-color:var(--accent,var(--gold));background:#372949}
.tile .game-icon,.game-icon{width:43px;height:43px;border-radius:13px;display:grid;place-items:center;color:var(--accent,var(--gold));font-size:24px;background:color-mix(in srgb,var(--accent,var(--gold)) 15%,#251c38);margin-bottom:11px}
.tile strong,.tile small{display:block}
.tile strong{font-size:15px;margin-bottom:5px}
.tile small{color:var(--muted);font-size:11px;line-height:1.5}
.tile .count{position:absolute;right:10px;top:10px;color:var(--gold);font-size:11px}
.foot{display:flex;justify-content:space-between;padding:23px 0 26px;color:#ac9bbb;font-size:12px;margin-top:16px}
.foot b{color:var(--gold);margin-right:4px}
.footer-record{border:0;background:none;color:inherit;padding:0;min-height:32px}
.footer-record:hover{color:var(--gold)}
.quiet[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
.screen{animation:appear .23s ease both}
@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.screen-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:12px 0 20px}
.screen-head h1{font-size:clamp(28px,6vw,52px);letter-spacing:-.035em;margin:0 0 7px;line-height:1.08}
.screen-head p{color:var(--muted);font-size:13px;margin:0;line-height:1.55}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:21px;padding:23px}
.narrow{max-width:690px;margin:auto}
.rooms-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.panel h2{font-size:20px;margin-bottom:8px}
.panel p{color:var(--muted);font-size:14px;line-height:1.65}
.field{width:100%;min-width:0;margin-bottom:10px;min-height:48px;padding:10px 12px;border:1px solid #615171;border-radius:11px;color:var(--text);background:#181226;text-transform:uppercase;letter-spacing:.09em;font-size:16px}
.room-tip{margin-top:16px;color:var(--muted);font-size:13px;line-height:1.65}
.room-tag{display:flex;flex-wrap:wrap;gap:7px 14px;align-items:center;color:var(--mint);font-size:12px;line-height:1.4;margin:0 0 13px}
.invite-actions{display:flex;flex-wrap:wrap;gap:7px}
.field.copy-field{text-transform:none;letter-spacing:0}
.role-rows{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:17px}
.seat{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid #544464;border-radius:15px;text-align:left;background:#251c36;min-height:61px}
.seat.active{border-color:var(--gold);background:#372744}
.seat strong,.seat small{display:block}
.seat strong{font-size:14px}
.seat small{color:var(--muted);font-size:11px;line-height:1.4;margin-top:3px}
.avatar{display:inline-grid;place-items:center;width:48px;height:48px;flex:none;background:var(--role-color,#3b2a4d);border-radius:14px;font-size:26px;overflow:hidden;vertical-align:middle}
.avatar img{width:100%;height:100%;object-fit:contain;object-position:center}
.avatars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:19px}
.role{display:flex;min-width:0;align-items:center;flex-direction:column;gap:6px;background:#282039;border:1px solid #4e3f5c;border-radius:16px;text-align:center;padding:10px 5px}
.role .avatar{width:100%;height:auto;aspect-ratio:1.03;font-size:clamp(30px,7vw,66px)}
.role strong{font-size:13px}.role small{font-size:11px;color:#e3cfe1}
.role[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.room-code{font-family:"IBM Plex Mono",monospace;font-size:18px;letter-spacing:.17em;color:var(--gold);margin:0 4px}
.hub-board{min-height:444px;position:relative;overflow:hidden;border-radius:23px;border:1px solid #594565;background:#28213c var(--map, none) center/cover;touch-action:manipulation}
.hub-board::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(160deg,#25143b34,transparent 50%,#1e173552),radial-gradient(ellipse at center,transparent 35%,#1d143d88)}
.map-trails{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.map-trails line{stroke:#ffdda788;stroke-width:.65;stroke-dasharray:1 1.35;stroke-linecap:round}
.stall{position:absolute;display:flex;flex-direction:column;align-items:center;gap:5px;transform:translate(-50%,-50%);border:0;background:none;text-align:center;padding:0;z-index:2;white-space:nowrap}
.stall:not(:disabled):active{transform:translate(-50%,-50%) scale(.96)}
.stall .game-icon{width:62px;height:62px;border:2px solid var(--accent);background:#2c2147;margin:0;box-shadow:0 5px 16px #130e25b0;color:var(--accent);font-size:29px}
.stall:hover .game-icon,.stall.active .game-icon{background:#4f395d}
.stall b{font-size:12px;line-height:1.3;background:#201630e8;border-radius:100px;padding:5px 8px}
.pawn{pointer-events:none;position:absolute;z-index:3;transform:translate(-50%,-50%);display:grid;justify-items:center;transition:left .28s ease,top .28s ease}
.pawn .avatar{width:38px;height:38px;border:2px solid #fbd5bd;box-shadow:0 3px 12px #130e25a0;border-radius:50%}
.pawn small{font-size:10px;background:#241a37;border:1px solid #665173;padding:2px 5px;border-radius:20px;margin-top:-3px;max-width:90px;white-space:nowrap}
.pawn.walking{animation:walk .28s ease both}
@keyframes walk{from{left:var(--from-x);top:var(--from-y)}}
.map-controls{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 0}
.map-controls .role-rows{margin:0;display:flex;gap:6px}.map-controls .avatar{height:29px;width:29px;font-size:17px;border-radius:9px}
.map-controls .seat{padding:5px 9px;min-height:44px}
.map-controls .seat strong{font-size:12px}.map-controls .seat small{display:none}
.map-notice{color:var(--muted);margin:0;font-size:13px}
.game-layout{max-width:750px;margin:0 auto}
.game-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.turn-pill{display:inline-flex;gap:7px;align-items:center;font-size:13px;color:#fff2e2}
.turn-pill .avatar{width:34px;height:34px;font-size:20px;border-radius:10px}
.toy-line{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toy-line .toy-avatar{background:#604051;border:1px solid #f3b298;font-size:27px;width:45px;height:45px}
.toy-helper{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.toy-helper .avatar{width:34px;height:34px;font-size:20px;border-radius:10px}
.metric{color:var(--gold);font-size:13px;text-align:right}
.play{padding:25px;min-height:305px}
.play h2{font-size:clamp(21px,4.8vw,31px);line-height:1.3;margin-bottom:9px}
.play p{margin-bottom:16px}
.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:16px 0}
.option{display:flex;align-items:center;gap:7px;justify-content:center;flex-direction:column;min-height:82px;padding:8px 5px;font-size:13px;background:#302440;color:#f9edf8;border:1px solid #5b466d;border-radius:13px;text-align:center}
.option:hover:not(:disabled){border-color:var(--gold)}
.option.marked{border-color:var(--gold);background:#50375a}
.option .option-icon{font-size:27px;line-height:1.1}
.swatch{width:25px;height:25px;border-radius:50%;background:var(--color);border:2px solid #fffb}
.stars-progress{display:flex;gap:10px;font-size:23px;margin-bottom:13px;color:#7b638c}.stars-progress .lit{color:var(--gold);text-shadow:0 0 12px #ffc37d75}
.shoot-panel{background:radial-gradient(ellipse at center,#412f5f,#271b3c 72%)}
.shoot-targets .option{height:112px;background:#241a35}.shoot-targets .star-on{border-color:#a17d80;color:#ffda93}.shoot-targets .star-off{border-style:dashed;color:#a890bf}
.shot-row{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 13px}
.shot-dot{width:17px;height:17px;border-radius:50%;border:1px solid #896e9a;color:#fdd59c;text-align:center;font-size:11px;line-height:15px}
.shot-dot.miss{color:#db9aa9}.shot-dot.hit{background:#4e3550}
.hide-scene{background:radial-gradient(ellipse at 45% 0,#3d2954,#251c37 70%)}
.hide-reveal{display:grid;place-items:center;width:83px;height:83px;margin:0 0 15px;border-radius:21px;border:1px solid #8d72a3;background:#4a365e;font-size:49px;animation:pop .28s ease both}
.hide-shots{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:#ead6ee;font-size:13px;margin-bottom:11px}
.hide-shots strong{color:var(--gold)}
.hide-shots .shot-row{margin:0}
.hide-board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
.hide-prop{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;min-width:0;min-height:65px;padding:7px 2px;text-align:center;color:#faedf7;background:#352747;border:1px solid #624b72;border-radius:11px;font-size:12px;line-height:1.2}
.hide-prop .option-icon{font-size:25px}
button.hide-prop:hover:not(:disabled){border-color:var(--gold)}
.hide-prop.shot-prop{background:#292138;opacity:.58}
.hide-prop small{position:absolute;top:4px;right:5px;color:#ffcca4;font-size:10px}
.hide-prop.my-prop{border-color:var(--gold);background:#583d50}
.hide-prop.my-prop small{position:static}
@media(max-width:560px){.hide-board{grid-template-columns:repeat(4,minmax(0,1fr))}.hide-prop{min-height:58px}}
.hide-stage{position:relative;min-height:340px;height:min(49svh,490px);isolation:isolate;overflow:hidden;border:1px solid #735f8b;border-radius:15px;background:#271d42}
.hide-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline-offset:-4px}
.hide-stage canvas:active{cursor:grabbing}
.hide-crosshair,.hide-view-label{pointer-events:none;position:absolute;z-index:1;text-shadow:0 2px 6px #24142b}
.hide-crosshair{top:50%;left:50%;transform:translate(-50%,-50%);font:28px/1 monospace;color:#fff7e9b5}
.hide-view-label{top:12px;left:12px;border-radius:100px;padding:5px 9px;color:#fff0dc;background:#281b46b5;font-size:11px}
.hide-camera{position:absolute;z-index:1;right:9px;bottom:9px;display:flex;gap:5px}
.hide-camera .btn{min-width:40px;min-height:40px;padding:5px 9px;background:#2e214de6}
.hide-toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:10px 0}
#hide-aim{font-size:13px;color:#ffe5c7}
.hide-help{font-size:12px!important;margin:4px 0 9px!important}
.hide-list{color:#e6d6ec;font-size:13px}
.hide-list summary{padding:7px 0;cursor:pointer}
.scan-clue{display:flex;align-items:center;gap:9px;margin:8px 0;padding:9px 11px;border-left:3px solid var(--mint);border-radius:7px;background:#38304b;color:#eff7ed;font-size:13px;animation:pop .28s ease both}
.scan-clue b{color:var(--mint)}
.hide-stage[data-renderer=fallback],.hide-stage[data-renderer=fallback]+.hide-toolbar #hide-fire,.hide-stage[data-renderer=fallback]+.hide-toolbar #hide-aim{display:none}
@media(max-width:480px){.hide-stage{min-height:290px;height:44svh}.hide-scene{padding:13px}.hide-camera .btn{font-size:12px}.hide-toolbar .actions>.btn{min-height:44px}}
.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.memory .option{font-size:25px;min-height:62px}
.memory .matched{background:#2e453e;border-color:#597f70;opacity:1}
.memory .revealed{background:#4b365b;border-color:#c1a0dc;opacity:1}
.result{border-color:#79605f;text-align:center;padding:35px 20px;background:radial-gradient(ellipse at center top,#543349,#251c36 65%)}
.result .actions{justify-content:center}
.big-star{font-size:59px;color:var(--gold);line-height:1;margin-bottom:12px;animation:pop .36s ease both}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.handoff{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.handoff .avatar{width:68px;height:68px;font-size:38px;margin-bottom:12px}
.feedback{color:var(--gold)!important}
.toast{position:fixed;z-index:10;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);padding:10px 15px;border-radius:13px;border:1px solid #806b89;background:#39284a;color:#fff4e9;text-align:center;font-size:13px;box-shadow:0 8px 28px #0006}
dialog{color:var(--text);background:var(--paper);border:1px solid #5b476b;border-radius:18px;padding:0;max-width:min(510px,calc(100% - 26px));width:100%;max-height:85svh}
dialog::backdrop{background:#0b0815b8}
.dialog-inner{padding:23px;position:relative}
.dialog-inner h2{margin:0 30px 13px 0}
.dialog-inner p,.dialog-inner li{color:#e6d6e7;font-size:14px;line-height:1.7}
.dialog-inner li{margin:7px 0}.dialog-inner ul{padding-left:19px}
.icon-btn{border-radius:10px;background:#30253f;border:1px solid #564569;width:42px;height:42px;font-size:22px}
.close{position:absolute;right:12px;top:12px}
@media(max-width:760px){.wrap{width:calc(100% - 32px)}.bar{height:67px}.hero{min-height:510px;align-items:flex-end;background-image:linear-gradient(0deg,#19132cf9 0%,#1d142cdb 37%,#1b142715 68%),var(--hero);background-position:63% center}.hero-content{padding:30px 23px}.hero h1{font-size:clamp(48px,10vw,66px);margin-bottom:12px}.hero .subtitle{margin-bottom:20px;font-size:14px}.section-head{margin-top:25px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{padding:12px}.hub-board{min-height:412px}.panel{padding:17px}.play{padding:18px}.map-controls{gap:8px}}
@media(max-width:390px){.wrap{width:calc(100% - 22px)}.hero{min-height:465px}.hero-content{padding:24px 16px}.btn{padding:10px 12px}.role strong{font-size:12px}.rooms-grid{grid-template-columns:1fr}.section-head p{display:none}.stall .game-icon{width:50px;height:50px;font-size:25px}.stall b{font-size:11px}.hub-board{min-height:390px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.stars-progress span {
  display: inline-block;
  transform-origin: 50% 58%;
  transition: color 180ms ease, text-shadow 180ms ease;
}

.stars-progress .newly-lit {
  color: var(--gold);
  animation: puzzle-star-light 550ms cubic-bezier(.17, .8, .24, 1) both;
}

@keyframes puzzle-star-light {
  0% { transform: scale(.62) rotate(-13deg); text-shadow: 0 0 0 #ffc37d00; }
  52% { transform: scale(1.29) rotate(7deg); text-shadow: 0 0 16px #ffd490c9; }
  100% { transform: scale(1); text-shadow: 0 0 12px #ffc37d75; }
}

.shoot-targets .star-on {
  border-color: var(--gold);
  color: #fff3c7;
  background: radial-gradient(ellipse at 50% 38%, #79525b, #33213e 69%);
  box-shadow: inset 0 0 0 1px #ffd39f66, 0 0 19px #ffd39f2f;
  animation: shooting-target-flash 460ms ease-out both;
}

.shoot-targets .star-on .option-icon {
  text-shadow: 0 0 12px #ffc774db;
  animation: shooting-star-pop 390ms cubic-bezier(.19, .8, .2, 1) both;
}

#shoot-feedback {
  border-inline-start: 2px solid var(--gold);
  padding: 5px 0 5px 11px;
  margin-block: 9px 0;
  animation: shooting-feedback-appear 270ms ease-out both;
}

#shoot-feedback.miss {
  border-color: var(--rose);
  color: #f3bec9 !important;
}

@keyframes shooting-target-flash {
  0% { box-shadow: inset 0 0 0 1px #ffd39f38, 0 0 0 #ffd39f00; }
  36% { box-shadow: inset 0 0 0 2px #ffe6b7, 0 0 27px #ffd39f76; }
  100% { box-shadow: inset 0 0 0 1px #ffd39f66, 0 0 19px #ffd39f2f; }
}

@keyframes shooting-star-pop {
  0% { transform: scale(.64); }
  58% { transform: scale(1.33); }
  100% { transform: scale(1); }
}

@keyframes shooting-feedback-appear {
  from { opacity: .35; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.toy-course {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  gap: 8px;
  list-style: none;
  padding: 10px 7px 8px;
  margin: 15px 0;
  border-radius: 15px;
  background: linear-gradient(180deg, #372844, #261c37);
}

.toy-route-step {
  position: relative;
  isolation: isolate;
  display: grid;
  justify-items: center;
  align-content: start;
  gap: 5px;
  min-width: 0;
  min-height: 45px;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.2;
}

.toy-route-step:not(:last-child)::after {
  content: '';
  position: absolute;
  z-index: -1;
  top: 16px;
  inset-inline-start: 50%;
  width: calc(100% + 8px);
  border-top: 1px dashed #836491;
  pointer-events: none;
}

.toy-route-icon {
  display: grid;
  place-items: center;
  width: 31px;
  height: 31px;
  font-size: 17px;
  border: 1px solid #705783;
  border-radius: 50%;
  background: #332346;
}

.toy-route-label {
  overflow-wrap: anywhere;
}

.toy-route-step.passed {
  color: var(--mint);
}

.toy-route-step.passed .toy-route-icon {
  border-color: #91b79e;
  background: #354b45;
}

.toy-route-step.passed:not(:last-child)::after {
  border-color: #91b79e;
}

.toy-route-step.active {
  color: var(--gold);
}

.toy-route-step.active .toy-route-icon {
  border-color: var(--gold);
  background: #594053;
  box-shadow: 0 0 0 2px #ffcd9125;
}

.toy-token {
  position: absolute;
  z-index: 1;
  top: -11px;
  inset-inline-start: calc(50% + 8px);
  line-height: 1;
  font-size: 19px;
  pointer-events: none;
  animation: toy-route-hop 440ms ease-out both;
}

@keyframes toy-route-hop {
  0% { transform: translate(-6px, 0) rotate(-10deg); }
  44% { transform: translate(-2px, -6px) rotate(4deg); }
  100% { transform: translate(0, 0); }
}

.memory .option {
  backface-visibility: hidden;
  transform-origin: center;
}

.memory .revealed {
  box-shadow: inset 0 0 0 1px #d7b7ed4c;
  animation: memory-card-flip 310ms cubic-bezier(.17, .72, .23, 1) both;
}

.memory .matched {
  box-shadow: inset 0 0 0 1px #b3dbc849;
  animation: memory-card-pair 320ms ease-out both;
}

@keyframes memory-card-flip {
  from { transform: perspective(360px) rotateY(-85deg); }
  to { transform: perspective(360px) rotateY(0); }
}

@keyframes memory-card-pair {
  0% { transform: scale(.95); }
  45% { transform: scale(1.045); }
  100% { transform: scale(1); }
}

@media (max-width: 430px) {
  .toy-course {
    gap: 5px;
    padding-inline: 4px;
  }

  .toy-route-step:not(:last-child)::after {
    width: calc(100% + 5px);
  }

  .toy-route-step {
    font-size: 11px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .stars-progress span {
    transition: none;
  }

  .stars-progress .newly-lit,
  .shoot-targets .star-on,
  .shoot-targets .star-on .option-icon,
  #shoot-feedback,
  .toy-token,
  .memory .revealed,
  .memory .matched {
    animation: none;
  }
}
.signal-panel{position:relative;background:radial-gradient(ellipse at 60% 0,#323f59,#241b36 70%)}
.signal-energy{display:block;margin-bottom:10px;color:#ff9fbd;font-size:22px;letter-spacing:.25em}
.signal-sequence{display:flex;gap:8px;margin:14px 0 19px}
.signal-tile{display:grid;place-items:center;min-width:42px;width:58px;aspect-ratio:1;border:1px solid #7a7f9c;border-radius:12px;background:#444267;font-size:clamp(20px,5vw,30px);animation:pop .24s ease both}
.signal-tile.dim{border-style:dashed;color:#b6a8c7;background:#342c48}
.signal-choices{grid-template-columns:repeat(4,minmax(0,1fr))}
.duel-panel{background:radial-gradient(ellipse at 50% 0,#503d53,#281e37 75%)}
.duel-hps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 14px}
.duel-hp{display:flex;align-items:center;min-width:0;gap:8px;border:1px solid #755b74;border-radius:10px;background:#382941;padding:7px}
.duel-hp .avatar{width:34px;height:34px;font-size:19px}
.duel-hp div{min-width:0;flex:1}
.duel-hp b,.duel-hp span{display:inline-block;font-size:12px;line-height:1.3}
.duel-hp span{float:right;color:#ffd2a5}
.duel-hp meter{display:block;width:100%;height:8px;margin-top:5px}
.duel-hp meter::-webkit-meter-bar{border:0;background:#1e192a;border-radius:12px}
.duel-hp meter::-webkit-meter-optimum-value{background:#89c8aa;border-radius:12px}
.duel-caption{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:9px}
.duel-caption h2{margin:0}.duel-caption span{font-size:13px;white-space:nowrap;color:var(--gold)}
.duel-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;border:1px solid #725a73;border-radius:13px;padding:9px;background:#211a31}
.duel-cell{display:grid;place-items:center;min-height:46px;height:clamp(46px,9vmin,82px);font-size:23px;font-weight:bold;border-radius:8px;border:1px solid #60506f;color:#b7a3c8;background:#322744}
.duel-cover{color:#ffe09f;border:1px solid #ab797b;background:repeating-linear-gradient(35deg,#724e69 0 6px,#78536c 6px 12px);box-shadow:inset 0 -4px #3b273851}
.duel-body{color:#303542;border-color:#a7cbbd;background:#a9d8b8}
.duel-body.head{color:#422738;background:#ffbc9a}
.duel-body.limb{background:#b4bdeb}
button.duel-cell:hover:not(:disabled){outline:2px solid #ffdd9c;outline-offset:-2px}
.duel-cover-flash,.duel-hit-flash,.duel-miss-flash{animation:duel-impact .36s ease both}
@keyframes duel-impact{0%{transform:scale(.86);filter:brightness(2)}100%{transform:scale(1);filter:brightness(1)}}
.duel-feedback{margin:10px 0!important;color:#e1cfeb!important;font-size:13px!important}
.duel-feedback.hit{color:#ffbfa0!important}
.duel-feedback.cover{color:#ffe0a5!important}
.duel-defense{border-top:1px solid #76566d;padding-top:10px;margin-top:10px}
.duel-defense .actions{margin:7px 0}
.duel-defense small{color:#cfbbd7}
.duel-pose{padding:6px 8px;min-height:42px;font-size:12px}
.duel-pose[aria-pressed=true]{border-color:#e0ad8b}
.duel-legend{display:flex;gap:10px;font-size:11px;color:#d6b8cf;margin-top:12px}
@media(max-width:420px){.duel-hps{gap:5px}.duel-hp{gap:4px;padding:5px}.duel-hp .avatar{width:27px;height:27px}.duel-cell{font-size:18px}.signal-tile{min-width:36px}}

<script>
window.arcadeStatic=true;
window.arcadeArt={"hero":"./assets/hero.webp","map":"./assets/map.webp","avatars":["./assets/role-0.webp","./assets/role-1.webp","./assets/role-2.webp","./assets/role-3.webp"]};
const internetRooms = (() => {
  const roomPrefix = 'starlight-arcade-v3-';
  const channelLabel = 'starlight-arcade-v3';
  const codeAlphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const roomTimeout = 15_000;

  function newCode() {
    const randomBytes = crypto.getRandomValues(new Uint8Array(8));
    return Array.from(randomBytes, value => codeAlphabet[value % codeAlphabet.length]).join('');
  }

  function connectionError(error) {
    switch (error?.type) {
      case 'browser-incompatible':
        return '当前浏览器不支持联机。请用较新版的 Safari、Chrome 或 Edge 打开。';
      case 'peer-unavailable':
        return '找不到这个房间。请确认房间码正确，而且房主仍在游戏中。';
      case 'unavailable-id':
        return '这个房间码已经在使用，请重新创建房间。';
      case 'webrtc':
      case 'negotiation-failed':
        return '两台设备之间未能建立连接，请更换网络后重试。';
      default:
        return '联机服务暂时连不上，请检查网络后重试。';
    }
  }

  function start(seat, code, onEvent) {
    return new Promise((resolve, reject) => {
      if (typeof Peer !== 'function') {
        reject(new Error('联机组件未加载，请重新打开游戏。'));
        return;
      }

      const isHost = seat === 'host';
      const peer = isHost ? new Peer(roomPrefix + code, { secure: true }) : new Peer({ secure: true });
      const pending = new Map();
      const queuedEvents = [];
      let activeConnection = null;
      let settled = false;
      let notificationsReady = false;
      let closed = false;
      let reconnectTimer;
      const deadline = setTimeout(() => fail(isHost
        ? '创建房间超时，请检查网络后重试。'
        : '加入房间超时。请确认房主仍在线，也可换一个网络重试。'), roomTimeout);

      function emit(type, message) {
        if (closed) return;
        const event = message === undefined ? { type } : { type, message };
        if (notificationsReady) onEvent(event);
        else queuedEvents.push(event);
      }

      function close() {
        if (closed) return;
        closed = true;
        clearTimeout(deadline);
        clearTimeout(reconnectTimer);
        for (const timer of pending.values()) clearTimeout(timer);
        pending.clear();
        queuedEvents.length = 0;
        activeConnection = null;
        if (!peer.destroyed) peer.destroy();
      }

      function fail(message) {
        if (closed || settled) return;
        close();
        reject(new Error(message));
      }

      function finish() {
        if (settled || closed) return;
        settled = true;
        clearTimeout(deadline);
        resolve({
          code,
          seat,
          send(message) {
            if (!activeConnection?.open) return false;
            try {
              activeConnection.send({ type: 'game-data', message });
              return true;
            } catch {
              emit('error', '当前消息发送失败，请检查网络。');
              return false;
            }
          },
          close,
        });
        // A consumer awaiting start() must receive the session before any event uses it.
        setTimeout(() => {
          if (closed) return;
          notificationsReady = true;
          for (const event of queuedEvents.splice(0)) {
            if (closed) break;
            onEvent(event);
          }
        }, 0);
      }

      function stopPending(connection) {
        clearTimeout(pending.get(connection));
        pending.delete(connection);
      }

      function expireConnection(connection, delay) {
        pending.set(connection, setTimeout(() => {
          stopPending(connection);
          connection.close();
        }, delay));
      }

      function bind(connection) {
        if (closed || connection.label !== channelLabel) {
          connection.close();
          return;
        }
        expireConnection(connection, roomTimeout);

        connection.on('open', () => {
          if (!isHost) connection.send({ type: 'hello' });
        });

        connection.on('data', packet => {
          if (closed || !packet || typeof packet !== 'object') return;
          if (connection === activeConnection && packet.type === 'game-data') {
            emit('message', packet.message);
            return;
          }
          if (!pending.has(connection) || !connection.open) return;

          if (isHost && packet.type === 'hello') {
            stopPending(connection);
            if (activeConnection) {
              connection.send({ type: 'room-full' });
              expireConnection(connection, 1_500);
              return;
            }
            activeConnection = connection;
            connection.send({ type: 'accepted' });
            emit('connected');
          } else if (!isHost && packet.type === 'accepted') {
            stopPending(connection);
            activeConnection = connection;
            finish();
            emit('connected');
          } else if (!isHost && packet.type === 'room-full') {
            fail('这个房间已有两位玩家，请更换房间码。');
          }
        });

        connection.on('close', () => {
          stopPending(connection);
          if (closed) return;
          if (connection === activeConnection) {
            activeConnection = null;
            emit('disconnected', isHost ? '搭档已离开，可以用原房间码重新加入。' : '与房主的连接已断开，请重新加入房间。');
          } else if (!isHost && !settled) {
            fail('房间连接已中断，请确认房主仍在线后重试。');
          }
        });

        connection.on('error', error => {
          if (!settled) fail(connectionError(error));
          else if (connection === activeConnection) emit('error', connectionError(error));
          else {
            stopPending(connection);
            connection.close();
          }
        });
      }

      peer.on('open', () => {
        if (closed || settled) return;
        if (isHost) finish();
        else bind(peer.connect(roomPrefix + code, { label: channelLabel, serialization: 'json', reliable: true }));
      });
      peer.on('connection', connection => {
        if (isHost) bind(connection);
        else connection.close();
      });
      peer.on('error', error => {
        if (!settled) fail(connectionError(error));
        else if (error?.type !== 'network' || !isHost) emit('error', connectionError(error));
      });
      peer.on('disconnected', () => {
        if (!settled || !isHost || closed) return;
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(() => {
          if (!closed && peer.disconnected && !peer.destroyed) peer.reconnect();
        }, 1_000);
      });
      peer.on('close', () => {
        if (!closed && settled && !activeConnection) emit('error', '联机房间已关闭，请重新创建或加入。');
      });
    });
  }

  return {
    create(onEvent) {
      return start('host', newCode(), onEvent);
    },
    join(input, onEvent) {
      const code = String(input).replace(/\s/g, '').toUpperCase();
      if (code.length !== 8 || [...code].some(character => !codeAlphabet.includes(character))) {
        return Promise.reject(new Error('请输入有效的 8 位房间码。'));
      }
      return start('guest', code, onEvent);
    },
  };
})();

function isMiniGameChoice(action, type, count) {
  return action?.type === type && Number.isInteger(action.index) && action.index >= 0 && action.index < count;
}

function canPlayMiniGame(state, seat) {
  return !state.done && seat === state.turn;
}

function randomMiniGameOrder(items) {
  const shuffled = [...items];
  for (let index = shuffled.length - 1; index > 0; index--) {
    const swap = Math.floor(Math.random() * (index + 1));
    [shuffled[index], shuffled[swap]] = [shuffled[swap], shuffled[index]];
  }
  return shuffled;
}

function startHideRound(round, results = []) {
  const props = miniGameData.hideProps.map((_, index) => index);
  const board = randomMiniGameOrder(props);
  return { turn: round, done: false, round, phase: 'hide', hider: round, board, spot: null, guesses: [], scans: 0, clue: null, decoy: null, decoyUsed:false, results };
}

function hideZone(index, dimension) {
  if(dimension==='side')return ['左侧','中间','右侧'][Math.floor((index%6)/2)];
  return ['前排','中排','后排'][Math.floor(index/6)];
}

function shootTargetsFor(target) {
  return Array.from({ length: miniGameData.shootTargets.length }, (_, index) => index === target);
}

const miniGames = {
  hide: {
    init() {
      return startHideRound(0);
    },
    act(state, action, seat) {
      if(state.phase==='guess'&&!state.done&&seat===state.hider&&action?.type==='decoy'&&!state.decoyUsed){
        const choices=state.board.map((_, i)=>i).filter(i=>hideZone(i,'depth')!==hideZone(state.spot,'depth')&&!state.guesses.includes(i));
        if(choices.length)return {...state,decoy:choices[Math.floor(Math.random()*choices.length)],decoyUsed:true};
      }
      if (!canPlayMiniGame(state, seat)) return state;
      if (state.phase === 'result') {
        if (action?.type !== 'continue') return state;
        return state.round === 0 ? startHideRound(1, state.results) : { ...state, done: true };
      }
      if (state.phase === 'hide') {
        if (action?.type !== 'transform') return state;
        const spot = Math.floor(Math.random() * state.board.length);
        return { ...state, spot, phase: 'reveal' };
      }
      if (state.phase === 'reveal') {
        if (action?.type !== 'ready') return state;
        return { ...state, phase: 'guess', turn: 1 - state.hider };
      }
      if(state.phase==='guess'&&action?.type==='scan'&&state.scans<2){
        const dimension=state.scans===0?'side':'depth';
        let zone=hideZone(state.spot,dimension);
        if(state.scans===1&&state.decoy!==null)zone=hideZone(state.decoy,dimension);
        return {...state,scans:state.scans+1,clue:{zone,dimension,interference:state.scans===1&&state.decoy!==null},decoy:state.scans===0?state.decoy:null};
      }
      if (state.phase !== 'guess' || !isMiniGameChoice(action, 'shoot', state.board.length)) return state;
      const { index } = action;
      if (state.guesses.includes(index)) return state;
      const guesses = [...state.guesses, index];
      const found = index === state.spot;
      if (!found && guesses.length < miniGameData.hideShotLimit) return { ...state, guesses, decoy:state.decoy===index?null:state.decoy };
      const result = { hider: state.hider, board: state.board, spot: state.spot, guesses, found };
      return { ...state, phase: 'result', guesses, results: [...state.results, result] };
    }
  },
  shoot: {
    init() {
      const targetOrder = randomMiniGameOrder([0, 1, 2, 0, 1, 2, 0, 1, 2, Math.floor(Math.random() * 3)]);
      return { turn: 0, done: false, shot: 0, targetOrder, targets: shootTargetsFor(targetOrder[0]), scores: [0, 0], history: [] };
    },
    act(state, action, seat) {
      if (!canPlayMiniGame(state, seat) || !isMiniGameChoice(action, 'shoot', miniGameData.shootTargets.length)) return state;
      const { index } = action;
      const hit = state.targets[index];
      const shot = state.shot + 1;
      const scores = [...state.scores];
      if (hit) scores[seat] += 1;
      return {
        ...state,
        turn: 1 - seat,
        done: shot === state.targetOrder.length,
        shot,
        targets: shootTargetsFor(state.targetOrder[shot]),
        scores,
        history: [...state.history, { seat, index, hit }]
      };
    }
  },
  toy: {
    init() {
      return { turn: 0, done: false, round: 0, toySeat: 0, step: 0, phase: 'move', mistakes: 0, completed: 0, feedback: null };
    },
    act(state, action, seat) {
      if (!canPlayMiniGame(state, seat)) return state;
      const obstacle = miniGameData.toySteps[state.round * 3 + state.step][state.phase];
      if (!isMiniGameChoice(action, 'pick', obstacle.options.length)) return state;
      const { index } = action;
      const correct = index === obstacle.correct;
      const feedback = { seat, index, correct };
      if (!correct) return { ...state, mistakes: state.mistakes + 1, feedback };
      if (state.phase === 'move') return { ...state, phase: 'help', turn: 1 - seat, feedback };
      const completed = state.completed + 1;
      if (completed === miniGameData.toySteps.length) return { ...state, done: true, completed, feedback };
      const round = Math.floor(completed / 3);
      return { ...state, round, toySeat: round, step: completed % 3, phase: 'move', turn: round, completed, feedback };
    }
  },
  memory: {
    init() {
      const ids = miniGameData.memorySymbols.map((_, index) => index);
      return { turn: 0, done: false, deck: randomMiniGameOrder([...ids, ...ids]), open: [], matched: [], scores: [0, 0], result: null };
    },
    act(state, action, seat) {
      if (!canPlayMiniGame(state, seat)) return state;
      if (state.open.length === 2) {
        if (action?.type !== 'continue') return state;
        return { ...state, turn: 1 - seat, done: state.matched.length === state.deck.length, open: [], result: null };
      }
      if (!isMiniGameChoice(action, 'flip', state.deck.length)) return state;
      const { index } = action;
      if (state.matched.includes(index) || state.open.includes(index)) return state;
      const open = [...state.open, index];
      if (open.length === 1) return { ...state, open };
      if (state.deck[open[0]] !== state.deck[index]) return { ...state, open, result: 'miss' };
      const scores = [...state.scores];
      scores[seat] += 1;
      return { ...state, open, matched: [...state.matched, ...open], scores, result: 'match' };
    }
  }
};

const signalSymbols = [
  { icon: '🌙', label: '月亮' },
  { icon: '🔔', label: '铃铛' },
  { icon: '🍓', label: '草莓' },
  { icon: '💎', label: '宝石' }
];

function nextSignalSequence(length, previous) {
  const sequence = Array.from({ length }, () => Math.floor(Math.random() * signalSymbols.length));
  if (previous?.length === length && sequence.every((symbol, index) => symbol === previous[index])) {
    const last = length - 1;
    sequence[last] = (sequence[last] + 1 + Math.floor(Math.random() * (signalSymbols.length - 1))) % signalSymbols.length;
  }
  return sequence;
}

function startSignalRound(round, energy, history, previous) {
  const reader = round % 2;
  return {
    turn: reader,
    done: false,
    round,
    phase: 'read',
    reader,
    sequence: nextSignalSequence(round + 3, previous),
    picks: [],
    energy,
    history,
    outcome: null,
    cleared: round
  };
}

const signalGame = {
  init() {
    return startSignalRound(0, 3, []);
  },
  act(state, action, seat) {
    if (state.done || seat !== state.turn) return state;

    if (state.phase === 'read') {
      if (action?.type !== 'ready') return state;
      return { ...state, phase: 'repeat', turn: 1 - state.reader };
    }

    if (state.phase === 'result') {
      if (action?.type !== 'continue') return state;
      if (state.energy === 0 || state.cleared === 3) return { ...state, done: true };
      return startSignalRound(state.cleared, state.energy, state.history, state.sequence);
    }

    if (state.phase !== 'repeat' || action?.type !== 'pick' || !Number.isInteger(action.index) ||
        action.index < 0 || action.index >= signalSymbols.length) return state;

    const picks = [...state.picks, action.index];
    const correct = action.index === state.sequence[state.picks.length];
    if (correct && picks.length < state.sequence.length) return { ...state, picks };

    return {
      ...state,
      phase: 'result',
      picks,
      energy: state.energy - Number(!correct),
      history: [...state.history, { round: state.round, success: correct, picks }],
      outcome: correct ? 'success' : 'miss',
      cleared: state.cleared + Number(correct)
    };
  }
};

const duelInitialCover = [
  false, true,  true,  true,  false,
  true,  true,  true,  true,  false,
  true,  true,  false, true,  true,
  false, true,  true,  false, true,
];

const duelDamage = { head: 100, torso: 30, limb: 10 };

function randomDuelPose() {
  return Math.floor(Math.random() * duelPoses.length);
}

const duelGame = {
  init() {
    return {
      turn: 0,
      done: false,
      hp: [duelGrid.maxHP, duelGrid.maxHP],
      covers: [[...duelInitialCover], [...duelInitialCover]],
      round: 0,
      shots: 0,
      pose: randomDuelPose(),
      poseChangedAt: Date.now(),
      feedback: null,
      winner: null,
    };
  },

  act(state, action, seat) {
    if (state.done || (seat !== 0 && seat !== 1) || !Number.isInteger(action?.index)) return state;

    const attacker = state.turn;
    const target = 1 - attacker;
    const index = action.index;

    if (action.type === 'pose') {
      if (seat !== target || !duelPoses[index] || state.pose === index) return state;
      const now = Date.now();
      if (now - state.poseChangedAt < duelGrid.poseCooldown) return state;
      return { ...state, pose: index, poseChangedAt: now };
    }

    if (action.type !== 'shoot' || seat !== attacker || index < 0 || index >= duelInitialCover.length || state.shots >= duelGrid.shotsPerTurn) {
      return state;
    }

    const blocked = state.covers[target][index];
    const part = blocked ? null : duelPoses[state.pose].parts[index];
    const damage = part ? duelDamage[part] : 0;
    const shots = state.shots + 1;
    const feedback = {
      type: blocked ? 'cover' : part ? 'hit' : 'miss',
      attacker,
      target,
      index,
      hex: index,
      round: state.round,
      shot: shots,
      damage,
      part,
    };

    let covers = state.covers;
    if (blocked) {
      covers = [...state.covers];
      covers[target] = [...covers[target]];
      covers[target][index] = false;
    }

    let hp = state.hp;
    if (damage) {
      hp = [...state.hp];
      hp[target] = Math.max(0, hp[target] - damage);
    }

    const next = { ...state, shots, covers, hp, feedback };
    if (hp[target] === 0) return { ...next, done: true, winner: attacker };
    if (shots < duelGrid.shotsPerTurn) return next;

    return {
      ...next,
      turn: target,
      round: state.round + 1,
      shots: 0,
      pose: randomDuelPose(),
      poseChangedAt: Date.now(),
    };
  },
};

const toyRoom = (() => {
  let current;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function makeRoom(onAim, onFire){
    const T=window.THREE;
    if(!T||!window.buildHideToy)return null;
    const canvas=document.createElement('canvas');
    let gl, renderer;
    try{
      gl=canvas.getContext('webgl2',{antialias:true,alpha:false})||canvas.getContext('webgl',{antialias:true,alpha:false});
      if(!gl)return null;
      renderer=new T.WebGLRenderer({canvas,context:gl,antialias:true});
    }catch{return null;}
    canvas.setAttribute('aria-label','玩具房三维视角，拖动观察，点玩具瞄准');
    canvas.tabIndex=0;
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.65));
    renderer.outputColorSpace=T.SRGBColorSpace;
    renderer.toneMapping=T.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.18;
    const scene=new T.Scene();
    scene.background=new T.Color(0x271d42);
    scene.fog=new T.Fog(0x271d42,16,29);
    const camera=new T.PerspectiveCamera(46,1,.1,60);
    const direct=new T.DirectionalLight(0xffd8b0,3.1);direct.position.set(-4,8,7);
    const fill=new T.HemisphereLight(0xf5edff,0x4f305f,2.1);
    const rim=new T.DirectionalLight(0xc6a5ff,1.7);rim.position.set(6,3,-4);
    scene.add(direct,fill,rim);
    const room=new T.Group();scene.add(room);
    const pickables=[];
    const owned=new Set();
    const mesh=(geometry,color,position,materialOptions={})=>{
      const material=new T.MeshStandardMaterial({color,roughness:.72,...materialOptions});
      const item=new T.Mesh(geometry,material);
      item.position.set(...position);
      owned.add(geometry);owned.add(material);
      room.add(item);
      return item;
    };
    const block=(width,height,depth,color,x,y,z)=>mesh(new T.BoxGeometry(width,height,depth),color,[x,y,z]);
    const round=(radius,height,color,x,y,z)=>mesh(new T.CylinderGeometry(radius,radius,height,20),color,[x,y,z]);
    block(34,.24,33,0x5b4979,0,-.15,0);
    block(30,13,.25,0x4e3969,0,5,-9);
    block(.25,13,19,0x3d325b,-13,5,-2);
    block(.25,13,19,0x3d325b,13,5,-2);
    for(let i=-6;i<=6;i++){
      block(.025,.008,24,0x7a659d,i*2,.004,-2);
      block(28,.008,.025,0x7a659d,0,.004,i*2);
    }
    for(let i=-5;i<=5;i++){
      block(.043,10,.09,0x675181,i*2.1,4,-8.82);
      if(i%2===0)mesh(new T.OctahedronGeometry(.15),0xffd395,[i*2.1,4.95+(i%4)*.18,-8.64],{emissive:0xdc8762,emissiveIntensity:.4});
    }
    block(27,.12,.15,0xb894be,0,1.15,-8.72);
    const ring=mesh(new T.TorusGeometry(.66,.028,8,44),0xffe4a6,[0,0,0],{emissive:0xfba454,emissiveIntensity:1.0});
    ring.rotation.x=Math.PI/2;ring.visible=false;
    const ray=new T.Raycaster(),pointer=new T.Vector2();
    const s={yaw:0,look:0,zoom:1,options:null,selected:-1,props:[],top:null,raf:0,down:null,hadDrag:false,pulse:null,rendered:false};
    const target=new T.Vector3();
    const center=new T.Vector3();
    const cast=(x,y)=>{
      if(!s.options||!s.rendered)return -1;
      ray.setFromCamera(pointer.set(x,y),camera);
      const hit=ray.intersectObjects(pickables,false).find(({object})=>!s.options.guesses.includes(object.userData.slot));
      return hit?hit.object.userData.slot:-1;
    };
    const valid=index=>{
      const options=s.options;
      return options?.can&&!options.pending&&!options.guesses.includes(index)&&index>=0&&index<s.props.length;
    };
    const pick=(index,fire=false)=>{
      if(!valid(index))return false;
      s.selected=index;
      onAim(index);
      draw();
      if(fire)onFire(index);
      return true;
    };
    function draw(){
      const zoom=s.zoom;
      const fit=Math.max(1, .97/camera.aspect);
      const distance=(10.5+(fit-1)*5.7)/zoom;
      camera.position.set(Math.sin(s.yaw)*distance,5.1+(fit-1)*1.7,Math.cos(s.yaw)*distance);
      camera.lookAt(target.set(Math.sin(s.yaw)*1.8,s.look+1.07,-1.30));
      camera.updateMatrixWorld();
      const focus=s.options?.spectate>=0?s.options.spectate:s.selected;
      ring.visible=focus>=0&&Boolean(s.props[focus]);
      if(ring.visible){
        ring.position.copy(s.props[focus].position);
        ring.position.y+=.029;
      }
      renderer.render(scene,camera);
      s.rendered=true;
    }
    function resized(){
      if(!s.top?.isConnected)return;
      const {width,height}=s.top.getBoundingClientRect();
      if(width<=0||height<=0)return;
      camera.aspect=width/height;
      camera.updateProjectionMatrix();
      renderer.setSize(Math.round(width),Math.round(height),false);
      draw();
    }
    const resize=new ResizeObserver(resized);
    function populate(identifiers){
      for(const prop of s.props)scene.remove(prop);
      for(const item of pickables){scene.remove(item);item.geometry.dispose();item.material.dispose();}
      pickables.length=0;
      s.props=identifiers.map((id,index)=>{
        const row=Math.floor(index/6), col=index%6;
        const x=(col-2.5)*1.78+(row%2)*.30;
        const y=[0,.50,1.0][row];
        const z=[3.05,.30,-2.56][row];
        const prop=window.buildHideToy(T,id);
        prop.position.set(x,y+.12,z);
        prop.userData.baseY=prop.position.y;
        prop.rotation.y=(col-2.5)*.065+(row===1?.17:-.07);
        scene.add(prop);
        round(.68,.10,0x8470a7,x,y+.044,z);
        if(row>0)round(.56,y,0x54416b,x,y/2,z);
        const box=new T.Box3().setFromObject(prop);
        const size=box.getSize(new T.Vector3());
        const clickable=new T.Mesh(
          new T.BoxGeometry(Math.max(.78,size.x+.17),Math.max(.73,size.y+.12),Math.max(.68,size.z+.18)),
          new T.MeshBasicMaterial({visible:false})
        );
        box.getCenter(clickable.position);
        clickable.userData.slot=index;
        scene.add(clickable);
        pickables.push(clickable);
        return prop;
      });
    }
    function animateShot(index,hit){
      if(!s.props[index]||reducedMotion)return;
      if(s.pulse){s.pulse.prop.scale.setScalar(1); cancelAnimationFrame(s.raf);}
      const p=s.props[index], start=performance.now();
      s.pulse={prop:p};
      const tick=now=>{
        const progress=Math.min(1,(now-start)/480);
        const kick=Math.sin(progress*Math.PI);
        p.scale.set(1+kick*.16,1-kick*.12,1+kick*.16);
        if(hit)p.rotation.y+=.065*kick;
        draw();
        if(progress<1)s.raf=requestAnimationFrame(tick);
        else{s.pulse=null;p.scale.setScalar(1);draw();}
      };
      s.raf=requestAnimationFrame(tick);
    }
    function selectAt(clientX,clientY){
      const b=canvas.getBoundingClientRect();
      const x=(clientX-b.left)/b.width*2-1,y=1-(clientY-b.top)/b.height*2;
      return pick(cast(x,y));
    }
    function drag(dx,dy){
      s.yaw=T.MathUtils.clamp(s.yaw-dx*.008,-.82,.82);
      s.look=T.MathUtils.clamp(s.look+dy*.018,-1.1,2.8);
      draw();
    }
    canvas.addEventListener('pointerdown',event=>{
      if(!event.isPrimary||event.button>0)return;
      s.down={id:event.pointerId,x:event.clientX,y:event.clientY,previousX:event.clientX,previousY:event.clientY};
      s.hadDrag=false;
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener('pointermove',event=>{
      if(!s.down||event.pointerId!==s.down.id)return;
      if(Math.hypot(event.clientX-s.down.x,event.clientY-s.down.y)>6)s.hadDrag=true;
      if(s.hadDrag)drag(event.clientX-s.down.previousX,event.clientY-s.down.previousY);
      s.down.previousX=event.clientX;s.down.previousY=event.clientY;
    });
    canvas.addEventListener('pointerup',event=>{
      if(!s.down||event.pointerId!==s.down.id)return;
      if(!s.hadDrag)selectAt(event.clientX,event.clientY);
      s.down=null;
    });
    canvas.addEventListener('pointercancel',()=>{s.down=null;});
    canvas.addEventListener('keydown',event=>{
      const steps={ArrowLeft:[22,0],ArrowRight:[-22,0],ArrowUp:[0,-22],ArrowDown:[0,22]};
      if(steps[event.key]){event.preventDefault();drag(...steps[event.key]);}
      if(event.key==='Enter'||event.code==='Space'){
        event.preventDefault();
        if(valid(s.selected))onFire(s.selected);else pick(cast(0,0));
      }
    });
    function aimCenter(){
      if(valid(s.selected)){onFire(s.selected);return;}
      if(!pick(cast(0,0),true))onAim(-1,true);
    }
    function clearAim(){
      s.selected=-1;
      onAim(-1);
      draw();
    }
    function reset(){
      s.yaw=0;s.look=0;s.zoom=1;
      clearAim();
    }
    function setZoom(delta){
      s.zoom=T.MathUtils.clamp(s.zoom+delta,.84,1.40);
      clearAim();
    }
    function attach(frame,options){
      const previous=s.options;
      s.options=options;
      if(!s.props.length)populate(options.board);
      if(s.selected>=0&&!valid(s.selected)&&!options.pending)s.selected=-1;
      for(const [i,prop] of s.props.entries()){
        prop.visible=true;
        prop.position.y=prop.userData.baseY-(options.guesses.includes(i)&&options.revealed!==i?.24:0);
      }
      if(s.top!==frame){
        resize.disconnect();s.top=frame;
        frame.prepend(canvas);resize.observe(frame);
      }
      frame.dataset.renderer='webgl';
      resized();
      onAim(valid(s.selected)?s.selected:-1);
      const shot=options.guesses.at(-1);
      if(previous&&options.guesses.length>previous.guesses.length&&shot>=0)animateShot(shot,shot===options.revealed);
    }
    function destroy(){
      cancelAnimationFrame(s.raf);resize.disconnect();
      for(const item of pickables){item.geometry.dispose();item.material.dispose();}
      for(const item of owned)item.dispose();
      renderer.dispose();renderer.forceContextLoss();
    }
    function getTargetPosition(index){
      if(!s.props[index]||!s.rendered)return null;
      pickables[index].getWorldPosition(center).project(camera);
      const b=canvas.getBoundingClientRect();
      return {x:b.left+(center.x+1)*b.width/2,y:b.top+(1-center.y)*b.height/2};
    }
    return {attach,aimCenter,clearAim,reset,setZoom,pick,destroy,getTargetPosition,canvas};
  }

  return {
    sync(frame,options,onAim,onFire){
      if(!frame||!options){
        if(current){current.room?.destroy();current=null;}
        return;
      }
      if(current?.key!==options.key){
        current?.room?.destroy();
        current={key:options.key,room:makeRoom(onAim,onFire)};
      }
      if(current.room){
        current.room.attach(frame,options);
        current.room.canvas.onwebglcontextlost=()=>{
          if(current?.key!==options.key||!current.room)return;
          const lost=current.room;
          current.room=null;lost.destroy();
          frame.dataset.renderer='fallback';
          const choices=frame.parentElement?.querySelector('.hide-list');
          if(choices)choices.open=true;
        };
      }else{
        frame.dataset.renderer='fallback';
        const choices=frame.parentElement?.querySelector('.hide-list');
        if(choices)choices.open=true;
      }
    },
    action(id){
      const room=current?.room;
      if(!room)return;
      if(id==='hide-fire')room.aimCenter();
      if(id==='hide-reset')room.reset();
      if(id==='hide-zoom-in')room.setZoom(.16);
      if(id==='hide-zoom-out')room.setZoom(-.16);
    },
    targetPosition(index){return current?.room?.getTargetPosition(index)??null;}
  };
})();

const puzzleGame = {
  init:()=>({turn:0,done:false,round:0,picks:[],result:null}),
  act(s,a,seat){
    if(s.done || seat!==s.turn)return s;
    const round=puzzles[s.round];
    if(a.type==='pick' && !s.result && Number.isInteger(a.index) && a.index>=0 && a.index<3){
      const picks=[...s.picks];picks[seat]=a.index;
      if(s.picks.length===0)return {...s,picks,turn:1-seat};
      return {...s,picks,result:picks.every((v,i)=>v===round.answer[i])?'hit':'miss'};
    }
    if(a.type==='continue' && s.result==='miss')return {...s,picks:[],turn:0,result:null};
    if(a.type==='continue' && s.result==='hit'){
      if(s.round===puzzles.length-1)return {...s,done:true};
      return {...s,round:s.round+1,picks:[],turn:0,result:null};
    }
    return s;
  }
};

function loadSave(){

    const data=JSON.parse(localStorage.getItem(saveKey));
    return {
      roles:Array.isArray(data?.roles)?[0,1].map(i=>Number.isInteger(data.roles[i])&&roles[data.roles[i]]?data.roles[i]:null):[null,null],
      records:Array.isArray(data?.records)?data.records.filter(x=>x&&Object.hasOwn(games,x.game)&&typeof x.id==='string').slice(0,50):[]
    };
  }catch{
    return {roles:[null,null],records:[]};
  }
}

function gameID(){
  return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12);

function reduce(current,action,actor){
  const {stage}=current;
  if(action.type==='role'&&stage==='lobby'){
    const i=action.index;
    if(!Number.isInteger(i)||!roles[i]||current.roles[1-actor]===i||current.roles[actor]===i)return current;
    const roleList=[...current.roles];roleList[actor]=i;
    return {...current,roles:roleList};
  }
  if(action.type==='hub'&&stage==='lobby'&&current.roles.every(i=>i!==null))return {...current,stage:'hub'};
  if(action.type==='lobby'&&stage==='hub')return {...current,stage:'lobby'};
  if(action.type==='map'&&stage==='game')return {...current,stage:'hub',game:null,play:null};
  if(stage==='hub'&&action.type==='walk'){
    if(!Number.isFinite(action.x)||!Number.isFinite(action.y))return current;
    const positions=[...current.positions];
    positions[actor]=[Math.max(5,Math.min(95,action.x)),Math.max(9,Math.min(88,action.y))];
    return {...current,positions};
  }
  const rematch=stage==='game'&&current.play.done&&action.type==='rematch';
  if((stage==='hub'&&action.type==='enter'&&Object.hasOwn(games,action.game)&&nearStall(current.positions[actor],action.game))||rematch){
    const id=rematch?current.game:action.game;
    return {...current,stage:'game',game:id,session:gameID(),play:engines[id].init()};
  }
  if(stage==='game'&&action.type==='game-action'&&action.input&&typeof action.input==='object'){
    const play=engines[current.game].act(current.play,action.input,actor);
    if(play!==current.play)return {...current,play};
  }
  return current;
}
let savedOk=true;
function applyState(next){
  if(!next)return;
  const previous=state;
  state=next;
  if(next.stage==='hub'&&previous.stage==='hub')walkOrigin=previous.positions;
  if(mode==='solo'&&next.stage==='game'&&previous.stage==='game'&&previous.session===next.session){
    if(next.game==='hide'&&next.play.phase==='guess'&&previous.play.phase==='reveal')handoff=true;
    if(next.game==='hide'&&next.play.phase==='hide'&&previous.play.round!==next.play.round)handoff=true;
    if(next.game==='puzzle'&&next.play.turn!==previous.play.turn&&!next.play.result)handoff=true;
    if(next.game==='signal'&&next.play.turn!==previous.play.turn&&next.play.phase==='repeat')handoff=true;
  }
  if(next.stage!=='game'||next.session!==previous.session)handoff=false;
  if(next.roles[0]!==previous.roles[0]||next.roles[1]!==previous.roles[1]){
    const indexes=mode==='solo'?[0,1]:[seat];
    for(const i of indexes)archive.roles[i]=next.roles[i];
    saveLocal();
  }
  if(next.stage==='game'&&next.play.done&&!archive.records.some(r=>r.id===next.session)){
    archive.records.unshift({id:next.session,game:next.game,when:Date.now(),result:summary(next)});
    archive.records.splice(50);
    savedOk=saveLocal();
  }
  go(next.stage);
}
const roomMessages={ROOM_NOT_FOUND:'找不到房间，请核对房间码。',ROOM_FULL:'房间已有两个人。',INVALID_TOKEN:'这个房间已结束，请重新加入。'};
async function requestRoom(path,method='GET',body,identity=room){
  const headers={};
  if(identity?.token)headers.Authorization='Bearer '+identity.token;
  if(body!==undefined)headers['Content-Type']='application/json';
  const response=await fetch('/api/rooms'+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});
  if(!(response.headers.get('content-type')||'').includes('application/json'))throw Error('无法连接房间服务，请刷新后重试。');
  const data=await response.json();
  if(!response.ok&&(response.status!==409||data.error))throw Error(roomMessages[data.error]||'房间连接失败，请再试一次。');
  return {status:response.status,data};
}
function acceptLan(data){
  const presence=Boolean(data.joined)!==joined;
  joined=Boolean(data.joined);
  if(data.version>version||data.version===version&&data.state&&view==='rooms'){
    version=data.version;applyState(data.state);
  }else if(presence)render();
}
async function pollLan(){
  if(!room||(mode!=='lan'&&mode!=='relay')||pending||polling)return;
  const here=room;
  polling=true;
  try{
    const {data}=await requestRoom('/'+here.code,'GET',undefined,here);
    if(room===here)acceptLan(data);
  }catch(e){if(room===here)notify(e.message);}
  finally{polling=false;}
}
function publishInternet(){
  let shared=state;
  if(state.game==='hide'&&state.play.hider===0&&['reveal','guess'].includes(state.play.phase)){
    shared={...state,play:{...state.play,spot:null,decoy:null}};
  }
  if(state.game==='signal'&&state.play.phase!=='result'&&state.play.reader===0){
    shared={...state,play:{...state.play,sequence:[]}};
  }
  if(state.game==='duel'&&state.play.turn===1&&!state.play.done){
    const play=state.play;
    const viewParts=duelPoses[play.pose].parts.map((part,i)=>play.covers[0][i]?null:part);
    shared={...state,play:{...play,pose:null,visibleParts:viewParts}};
  }
  if(joined&&room&&!room.send({kind:'snapshot',version,state:shared}))notify('同步暂时中断。');
}
function peerEvent(event,connectionEpoch){
  if(epoch!==connectionEpoch||mode!=='internet')return;
  if(event.type==='connected'){
    joined=true;render();
    if(seat===0)publishInternet();
    return;
  }
  if(event.type==='disconnected'||event.type==='error'){
    if(event.type==='disconnected')joined=false;
    pending=false;render();
    notify(typeof event.message==='string'?event.message:'搭档已断开。可重新加入这个房间。');
    return;
  }
  if(event.type!=='message'||!event.message||typeof event.message!=='object')return;
  const incoming=event.message;
  if(seat===0&&incoming.kind==='action'&&incoming.action&&typeof incoming.action==='object'){
    const duelInput=incoming.action.type==='game-action'&&state.game==='duel'&&incoming.session===state.session&&
      incoming.round===state.play.round&&incoming.shots===state.play.shots;
    if(incoming.version===version||duelInput){
      const next=reduce(state,incoming.action,1);
      if(next!==state){version++;applyState(next);}
    }
    publishInternet();
  }
  if(seat===1&&incoming.kind==='snapshot'&&Number.isInteger(incoming.version)&&incoming.version>=version&&incoming.state){
    pending=false;version=incoming.version;applyState(incoming.state);
  }
}
async function openRoom(create,code){
  if(roomBusy)return;
  if(!create){
    roomDraft=code;

  }else roomDraft='';

  const op=++epoch;
  mode=roomTab;

  joined=false;version=0;state=fresh();pending=false;
  const preferred=archive.roles[seat];
  if(preferred!==null)state.roles[seat]=preferred;
  try{
    if(mode==='internet'){
      const conn=await (create?internetRooms.create(e=>peerEvent(e,op)):internetRooms.join(code,e=>peerEvent(e,op)));
      if(op!==epoch){conn.close();return;}
      room=conn;
      if(create)go('lobby');
      else if(view==='rooms')go('lobby');
    }else{
      const {data}=await requestRoom(create?'':'/'+code+'/join','POST',{},null);
      if(op!==epoch)return;
      room={code:data.code,token:data.token};joined=!!data.joined;version=data.version;
      if(data.state)applyState(data.state);else go('lobby');
      if(create){
        const {data:initial}=await requestRoom('/'+room.code,'PUT',{version,state});
        if(op===epoch)acceptLan(initial);
      }
      if(op===epoch)pollTimer=setInterval(pollLan,725);
    }
    if(!create&&op===epoch&&inviteCode&&location.search){
      const current=new URL(location.href);
      current.searchParams.delete('room');
      current.searchParams.delete('network');
      try{history.replaceState(null,'',current.href);}catch{}
    }
  }catch(e){if(op===epoch){roomError=e?.message||'房间连接失败。';go('rooms');}}
  finally{if(op===epoch)roomBusy=false;if(op===epoch&&view==='rooms')render();}

async function dispatch(action,actor=mode==='solo'?(view==='lobby'?roleCursor:view==='hub'?mapCursor:state.play?.turn??0):seat){
  if(pending)return;
  if(mode==='internet'&&seat===1){
    if(!joined){notify('搭档已断开，请重新加入。');return;}
    pending=true;
    if(!room.send({kind:'action',version,action,session:state.session,round:state.play?.round,shots:state.play?.shots})){pending=false;notify('消息发送失败，请再试一次。');}
    else{
      const sentVersion=version;
      setTimeout(()=>{
        if(mode==='internet'&&pending&&version===sentVersion){pending=false;notify('等待同步超时，可以再试一次。');}
      },3500);
    }
    return;
  }
  const next=reduce(state,action,actor);
  if(next===state)return;
  if(mode==='solo'){applyState(next);return;}
  if(mode==='internet'){
    if(!joined&&state.stage==='game'){notify('搭档已断开，请等对方重新加入。');return;}
    version++;applyState(next);publishInternet();return;
  }
  pending=true;
  const here=room;
  try{
    const {data,status}=await requestRoom('/'+here.code,'PUT',{version,state:next},here);
    if(room!==here)return;
    pending=false;acceptLan(data);
    if(status===409)notify('搭档刚刚完成了操作，请再试一次。');
  }catch(e){if(room===here){pending=false;notify(e.message);}}
}
function leaveRoom(){

  state=fresh();go('home');
}

}
function showRecords(){
  ruleContent.innerHTML=`<h2>本机存档</h2>${archive.records.length?`<ul>${archive.records.slice(0,12).map(r=>`<li><b>${games[r.game].name}</b>　${safe(r.result||'已完成')} <small>${safe(new Date(r.when).toLocaleDateString('zh-CN'))}</small></li>`).join('')}</ul>`:'<p>目前还没有完成的游戏。每次通关后会自动记录。</p>'}<p>此设备当前浏览器保留最近 50 局记录和选角。</p>`;
  dialog.showModal();
}
function showCopyText(value,label){
  ruleContent.innerHTML=`<h2>${label}</h2><p>长按下方内容，选择复制后发给搭档。</p><input class="field copy-field" aria-label="${label}" type="text" readonly>`;
  const field=ruleContent.querySelector('input');
  field.value=value;
  dialog.showModal();field.focus();field.select();
}
async function copyText(value,label){
  try{
    if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(value);notify(`已复制${label}。`);return;}
    const input=document.createElement('textarea');
    input.style.cssText='position:fixed;left:0;top:0;opacity:0';
    input.value=value;input.readOnly=true;document.body.append(input);
    try{
      input.focus();input.select();input.setSelectionRange(0,value.length);
      if(document.execCommand('copy')){notify(`已复制${label}。`);return;}
    }finally{input.remove();}
  }catch{}
  showCopyText(value,label);
}
function copyInvite(){
  if(!room)return;
  const link=new URL(location.href);
  link.search='';link.hash='';
  link.searchParams.set('room',room.code);
  if(mode==='lan')link.searchParams.set('network','wifi');
  copyText(link.href,'邀请链接');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(b?.matches('[data-rules]'))return showRules();
  if(b?.matches('[data-info]'))return showRules(b.dataset.info);
  if(!b){
    const board=e.target.closest('#map-board');
    if(board){
      const box=board.getBoundingClientRect();
      dispatch({type:'walk',x:(e.clientX-box.left)/box.width*100,y:(e.clientY-box.top)/box.height*100});
    }
    return;
  }
  if(b.dataset.role!==undefined){
    const actor=mode==='solo'?roleCursor:seat;
    const wasEmpty=state.roles[1-actor]===null;
    dispatch({type:'role',index:Number(b.dataset.role)},actor);
    if(mode==='solo'&&wasEmpty){roleCursor=1-actor;render();}
    return;
  }
  if(b.dataset.roleSeat!==undefined){roleCursor=Number(b.dataset.roleSeat);render();return;}
  if(b.dataset.mapSeat!==undefined){mapCursor=Number(b.dataset.mapSeat);render();return;}
  if(b.dataset.game){
    const g=games[b.dataset.game];
    dispatch({type:'walk',x:g.x,y:g.y});return;
  }
  if(b.dataset.enter){dispatch({type:'enter',game:b.dataset.enter});return;}
  if(b.dataset.choice!==undefined){
    const type=['shoot','hide','duel'].includes(state.game)?'shoot':state.game==='memory'?'flip':'pick';
    dispatch({type:'game-action',input:{type,index:Number(b.dataset.choice)}});return;
  }
  if(b.dataset.pose!==undefined){
    const actor=mode==='solo'?1-state.play.turn:seat;
    dispatch({type:'game-action',input:{type:'pose',index:Number(b.dataset.pose)}},actor);
    return;
  }
  if(b.id==='join-room')return;
  if(b.id==='local-start'){mode='solo';seat=0;roleCursor=0;mapCursor=0;state=fresh(true);go('lobby');}
  if(b.id==='rooms-start'){roomTab=defaultNetwork();roomError='';roomDraft='';go('rooms');}
  if(b.id==='home-link'||b.id==='back-home'||b.id==='leave')leaveRoom();
  if(b.id==='internet-tab'||b.id==='lan-tab'){
    if(roomBusy)return;
    roomTab=b.id==='lan-tab'?'lan':defaultNetwork();roomError='';roomDraft='';render();
  }
  if(b.id==='create-room')openRoom(true);
  if(b.id==='copy-room'&&room)copyText(room.code,'房间码');
  if(b.id==='copy-invite')copyInvite();
  if(b.id==='open-arcade'){mapCursor=0;dispatch({type:'hub'});}
  if(b.id==='reselect')dispatch({type:'lobby'});
  if(b.id==='to-hub'||b.id==='result-map')dispatch({type:'map'});
  if(b.id==='rematch')dispatch({type:'rematch'});
  if(b.id==='reveal-turn'){handoff=false;render();}
  if(b.id==='transform-hide')dispatch({type:'game-action',input:{type:'transform'}});
  if(b.id==='start-hide')dispatch({type:'game-action',input:{type:'ready'}});
  if(b.id==='signal-ready')dispatch({type:'game-action',input:{type:'ready'}});
  if(b.id==='hide-scan')dispatch({type:'game-action',input:{type:'scan'}});
  if(b.id==='hide-decoy')dispatch({type:'game-action',input:{type:'decoy'}});
  if(['hide-fire','hide-reset','hide-zoom-in','hide-zoom-out'].includes(b.id))toyRoom.action(b.id);
  if(b.id==='continue-game')dispatch({type:'game-action',input:{type:'continue'}});
  if(b.id==='records')showRecords();
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='join-form')return;
  e.preventDefault();
  if(roomBusy)return;
  const code=normalizeCode(new FormData(e.target).get('room-code')||'');
  openRoom(false,code);
});
if(window.arcadeArt?.hero)document.documentElement.style.setProperty('--hero',`url(${window.arcadeArt.hero})`);
if(window.arcadeArt?.map)document.documentElement.style.setProperty('--map',`url(${window.arcadeArt.map})`);
async function startPage(){
  if(inviteCode){view='rooms';roomDraft=inviteCode;roomBusy=true;}
  render();
  if(location.protocol!=='file:'&&!window.arcadeStatic){
    try{
      const r=await fetch('/api/status',{cache:'no-store',signal:AbortSignal.timeout(4500)});
      if(r.ok&&(r.headers.get('content-type')||'').includes('application/json')){
        const capability=await r.json();
        window.arcadeRelay=window.arcadeRelayOnly||capability.relay===true;
        window.arcadeLan=capability.lan===true;
      }
    }catch{}
  }
  if(inviteCode&&view==='rooms'&&roomBusy){
    roomBusy=false;
    roomTab=inviteLan&&window.arcadeLan?'lan':defaultNetwork();
    if(inviteLan&&!window.arcadeLan){
      roomError='这个邀请需要连接房主所在的 Wi-Fi。';
      render();
      return;
    }
    openRoom(false,inviteCode);
  }else if(view==='rooms'&&!roomBusy){
    const code=app.querySelector('#room-code');
    if(code)roomDraft=code.value;
    roomTab=defaultNetwork();
    render();
  }
}
startPage();

</script>
